name: Publish verified Authorities refactor stack
on:
  push:
    branches: [codex/authorities-shared-inputs]
    paths: [.github/workflows/authorities-stack-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'eliziff/Beaver' && github.ref == 'refs/heads/codex/authorities-shared-inputs'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Publish only the two dedicated refactor branches
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/eliziff/Beaver.git
          git fetch --depth=2 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD^)" = 3297d0c4bbfbd0cf6e20e7b79c783d840394f676
          test -z "$(git ls-remote --heads origin refs/heads/codex/authorities-shared-workflows)"
          git config user.name 'Eli Ziff'
          git config user.email 'eliziff@users.noreply.github.com'
          python3 - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('backend/src/lib/authoritiesDomain.ts')
          text = p.read_text()
          before = 'import type { AuthoritySourceLanguage, AttachedAuthoritySource, AuthoritySourceDecision,'
          assert text.count(before) == 1
          text = text.replace(before, 'import type { AuthoritySourceLanguage, AuthoritySourceDecision,')
          data = text.encode()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == '06b18c8721beca019eab677f94e6512b71063a2f'
          p.write_bytes(data)
          PY
          git add backend/src/lib/authoritiesDomain.ts
          git rm .github/workflows/authorities-stack-publish.yml
          git diff --cached --check
          git commit -m 'Remove unused shared source type import [skip ci]'
          first=$(git rev-parse HEAD)
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          def blob_hash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          parts = ['bb5b59e706e242873a7eec4fedd10a009884008d', 'f5e0c0fbb351b05f591d26a7af3ab36fb1c0f253', '329569cc44dd0b0da94b57168ece1bc9adfc6d8d', 'cb2c75e84b4bdd0ac31c34d3ba280a3d811e6cfa', '960743debc074811ad87027792b267d1f34d55ae', '6406a37e4462beec8a5fced42556485be4301965']
          compressed = bytearray()
          for sha in parts:
              req = urllib.request.Request('https://api.github.com/repos/eliziff/Beaver/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = base64.b64decode(json.load(response)['content'])
              assert blob_hash(data) == sha
              compressed.extend(data)
          data = gzip.decompress(compressed)
          assert hashlib.sha256(data).hexdigest() == '95216ea113f102dcba0f5a807dd560a6a8548562cb7ccc141ede311b97fcf563'
          recipe = json.loads(data)
          expected = {'backend/src/lib/__tests__/localAssistantTools.test.ts', 'backend/src/lib/authoritiesActionContract.ts', 'backend/src/lib/authoritiesActions.ts', 'backend/src/lib/authoritiesPreparation.test.ts', 'backend/src/lib/authoritiesPreparation.ts', 'backend/src/lib/authoritiesSourceResolution.ts', 'backend/src/lib/authoritiesWorkspaceApplication.test.ts', 'backend/src/lib/authoritiesWorkspaceApplication.ts', 'backend/src/lib/chat/assistantTools.ts', 'backend/src/routes/authoritiesRuntime.ts'}
          assert {entry['path'] for entry in recipe['files']} == expected
          # Preserve the pinned repository test; the source artifact also had unrelated edits.
          assistant_path = 'backend/src/lib/__tests__/localAssistantTools.test.ts'
          assert recipe['sources'][0]['path'] == assistant_path
          assistant = pathlib.Path(assistant_path).read_bytes()
          assert blob_hash(assistant) == '8d81a2821356eecc3e117a918e9de97fd49834d1'
          text = assistant.decode()
          old_import = 'await import("../authoritiesWorkspaceApplication")'
          assert text.count(old_import) == 2
          assistant_changed = text.replace(old_import, 'await import("../authoritiesActions")').encode()
          literals = {(18,19): '\n', (26,27): '\n', (155,157): '});\n\n',
              (193,195): '  });\n\n', (2386,2389): '    expect(read).not.toHaveBeenCalled();\n  });\n\n',
              (2412,2414): '  });\n\n', (2458,2459): '\n', (2471,2473): '  });\n\n',
              (2526,2528): '  });\n\n', (2563,2564): '\n', (2570,2572): '  });\n\n',
              (2640,2641): '    });\n', (2643,2645): '  });\n});\n',
              (107,108): ') {\n', (120,122): '}\n\n', (200,201): '    },\n'}
          sources = [None]
          for entry in recipe['sources'][1:]:
              assert entry['path'] in expected
              original = pathlib.Path(entry['path']).read_bytes()
              assert blob_hash(original) == entry['sha'], entry['path']
              sources.append(original.decode().splitlines(keepends=True))
          def render(part):
              if isinstance(part, str): return part
              index, start, end = part
              if index == 0: return literals[(start, end)]
              return ''.join(sources[index][start:end])
          prepared = {assistant_path: assistant_changed}
          for entry in recipe['files']:
              if entry['path'] == assistant_path: continue
              result = ''.join(render(part) for part in entry['parts']).encode()
              assert blob_hash(result) == entry['sha'], entry['path']
              prepared[entry['path']] = result
          for path, result in prepared.items():
              pathlib.Path(path).write_bytes(result)
          subprocess.run(['git', 'add', '--', *sorted(expected)], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          PY
          git diff --cached --check
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
          npm run build --prefix backend
          node scripts/check-source-boundaries.mjs
          git commit -m 'Share Authorities correction, refresh and source preparation workflows [skip ci]'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --atomic origin "$first":refs/heads/codex/authorities-shared-inputs HEAD:refs/heads/codex/authorities-shared-workflows
          echo "PR1_SHA=$first"
          echo "PR2_SHA=$(git rev-parse HEAD)"
