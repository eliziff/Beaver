name: Prepare UNO console lockfile
on:
  pull_request:
    paths: ['.github/workflows/uno-lockfile.yml']
permissions:
  contents: read
jobs:
  lockfile:
    if: github.event.pull_request.number == 124 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/libreoffice-uno-editing-2026-09-19'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Resolve exact dependency; do not run package scripts
        run: npm install --prefix backend --ignore-scripts --package-lock-only --save-exact quickjs-emscripten@0.31.0
      - name: Commit only the dependency manifest and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package.json backend/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Pin QuickJS WASM console dependencies'
          git push origin HEAD:refs/heads/codex/libreoffice-uno-editing-2026-09-19
