name: Authorities continuous selection validation
on:
  push:
    branches: [fix/authorities-continuous-selection]
    paths: ['.github/workflows/authorities-selection-validation.yml', 'frontend/src/app/components/shared/views/**']
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact page-scale metadata and verify browser-tested source
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          root=Path('frontend/src/app/components/shared/views')
          p=root/'PdfCanvas.tsx';s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='a20eeeac2fa90c4faf6a8596a9cd6a10a2ec494922cbc70efa9b0142b01aa75f'
          old='                wrapper.dataset.pageNumber = String(index + 1);\n'
          assert s.count(old)==1
          p.write_text(s.replace(old,old+'                wrapper.dataset.pdfScale = String(scale);\n'))
          expected={'PdfCanvas.tsx':'c373c18a7c8a7d67dd072221c0af8132ea2a34f94c02e23a15855bca0313cd90','pdfSelectionGeometry.ts':'1aa5b5e2d1613f691b37e5f89dbfd7becca61a68302c55500d4c46bc91cb339d','pdfSelectionGeometry.LICENSE':'81a734d06a04659cb19740834d39dd54ed1365c45669a185dca320f96f6977b8','pdfTextSelection.ts':'c9dbc0d68cc5382afd4434a33495ba358df09407af7a31e09ec36c4b901bd25e','pdfAnnotationLayer.ts':'82a3554efa777774a572a851d33abadf1e54290853d18b6054b2386f6fd6cb7e','pdfRecognizedText.ts':'fef1548ce810c0915cb7fe4f24bd5c49c62743967aef22708c5a362e8c3a5f73','pdfTextLayer.css':'350f012becc4f6b92de126c7c99f4e7dcfef3561b0cd160bbf08a76fc9630bab'}
          for name,sha in expected.items():
            assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha,name
          print('Exact browser-tested candidate hashes verified')
      - name: Install locked application dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Application typechecks and focused existing viewer and Authorities tests
        run: |
          npm run build --prefix backend
          (cd frontend && npx tsc --noEmit && npx vitest run src/app/components/shared/views/PdfView.test.tsx src/app/authorities/QuotationFinding.test.tsx src/app/authorities/standaloneHost.test.tsx)
          npm run check:source-boundaries
          git diff --check
      - name: Commit validated metadata and remove this temporary workflow
        run: |
          git add frontend/src/app/components/shared/views/PdfCanvas.tsx
          git rm .github/workflows/authorities-selection-validation.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: keep line-band tolerances stable across PDF zoom'
          git push origin HEAD:fix/authorities-continuous-selection
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
