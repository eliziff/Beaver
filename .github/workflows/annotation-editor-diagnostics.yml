name: Annotation editor diagnostics
on:
  push:
    branches: [codex/authorities-visual-highlight-editor]
    paths: [.github/workflows/annotation-editor-diagnostics.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public source without initializing unrelated submodules
        run: |
          git clone --depth 1 --no-checkout --branch codex/authorities-visual-highlight-editor https://github.com/eliziff/Beaver.git source-repo
          python3 - <<'PY'
          import subprocess, pathlib
          root = pathlib.Path('source-repo')
          available = subprocess.check_output(['git','ls-tree','--name-only','HEAD'], cwd=root, text=True).splitlines()
          wanted = ['frontend','backend','shared','scripts','docs','AGENTS.md','package.json','package-lock.json','subrepos.lock.json']
          with open('annotation-editor-source.tar','wb') as out:
              subprocess.run(['git','archive','--format=tar','HEAD',*[p for p in wanted if p in available]], cwd=root, stdout=out, check=True)
          PY
          gzip annotation-editor-source.tar
          tar -xzf annotation-editor-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: annotation-editor-source
          path: annotation-editor-source.tar.gz
          retention-days: 1
      - name: Install browser test dependencies without lifecycle scripts
        run: npm ci --prefix frontend --ignore-scripts
      - name: Bundle isolated browser dependencies
        run: tar -czf annotation-editor-dependencies.tar.gz frontend/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: annotation-editor-dependencies
          path: annotation-editor-dependencies.tar.gz
          retention-days: 1
