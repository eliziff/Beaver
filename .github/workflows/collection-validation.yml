name: Collection validation
on:
  push:
    branches: [codex/collection-reuse]
    paths: [.github/workflows/collection-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'eliziff/Beaver' && github.ref == 'refs/heads/codex/collection-reuse'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out public candidate without initializing orphan submodules
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/eliziff/Beaver.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          mkdir -p .collection-validation
      - name: Apply verified collection patch to this feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat .collection-transfer/*.gzpart | gzip -d > /tmp/collection.patch
          echo 'ec26650bc7badd8088a2660d0e810a66e9a8f344a84768344c58093b0c1090ce  /tmp/collection.patch' | sha256sum --check
          git apply --check /tmp/collection.patch
          git apply --index /tmp/collection.patch
          git rm -r .collection-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reuse account-scoped collection snapshots and revalidate without remount flashes'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/codex/collection-reuse
          git rev-parse HEAD | tee .collection-validation/validated-sha.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix frontend
          npm ci --ignore-scripts --prefix backend
      - name: Full frontend tests
        run: npm test --prefix frontend 2>&1 | tee .collection-validation/frontend-tests.log
      - name: Production builds and standalone boundaries
        if: ${{ !cancelled() }}
        run: npm run build --prefix frontend 2>&1 | tee .collection-validation/frontend-build.log
      - name: Source boundaries
        if: ${{ !cancelled() }}
        run: |
          npm run build --prefix backend 2>&1 | tee .collection-validation/backend-build.log
          node scripts/check-source-boundaries.mjs 2>&1 | tee .collection-validation/boundaries.log
      - name: Build pinned comparison
        if: ${{ !cancelled() }}
        run: |
          git fetch --depth=1 origin bd896cb8a06af9f472feefa3875d65d579235263
          git worktree add --detach .collection-baseline FETCH_HEAD
          cmp frontend/package-lock.json .collection-baseline/frontend/package-lock.json
          ln -s "$PWD/frontend/node_modules" .collection-baseline/frontend/node_modules
          (cd .collection-baseline/frontend && npx vite build --outDir ../../.collection-validation/baseline --emptyOutDir) 2>&1 | tee .collection-validation/baseline-build.log
      - name: Production browser reuse, freshness and mutation checks
        if: ${{ !cancelled() }}
        run: |
          npx playwright install --with-deps chromium
          node scripts/test-collection-reuse.mjs frontend/dist .collection-validation/baseline .collection-validation/browser 2>&1 | tee .collection-validation/browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: collection-validation
          include-hidden-files: true
          path: |
            .collection-validation/*.log
            .collection-validation/*.txt
            .collection-validation/browser
          retention-days: 7
