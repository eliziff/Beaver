name: Authorities highlight integration validation
on:
  push:
    branches: [fix/authorities-highlight-selection-ocr]
    paths: [.github/workflows/authorities-highlight-validation.yml]
permissions:
  contents: write
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore the exact parser and native source combination
        run: |
          git submodule update --init legal-pdf-parser legal-structure
          git -C legal-pdf-parser fetch origin af826e73b629ff656cab38a5014e2064870ff56e
          git -C legal-pdf-parser checkout af826e73b629ff656cab38a5014e2064870ff56e
      - name: Install JavaScript dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Link native addon once for the final integration gate
        run: |
          cargo build --manifest-path native/legal-structure-node/Cargo.toml --lib
          echo "LEGAL_STRUCTURE_NATIVE=$PWD/native/legal-structure-node/target/debug/liblegal_structure_node.so" >> "$GITHUB_ENV"
      - name: Build backend and check frontend types
        run: |
          npm run build --prefix backend
          cd frontend && npx tsc --noEmit
      - name: Focused existing frontend and backend checks
        run: |
          (cd frontend && npx vitest run src/app/components/shared/views/PdfView.test.tsx src/app/authorities/QuotationFinding.test.tsx src/app/authorities/standaloneHost.test.tsx)
          (cd backend && npx vitest run src/lib/__tests__/documentProjectionService.test.ts)
          npm run check:source-boundaries
      - name: Prepare synthetic scanned-page fixture and local OCR runtime
        run: |
          command -v tesseract || (sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng)
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          image = Image.new('RGB', (1400, 450), 'white')
          draw = ImageDraw.Draw(image)
          font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 44)
          draw.text((70, 100), 'Recognized words remain selectable.', font=font, fill='black')
          draw.text((70, 180), 'Highlight this scanned passage.', font=font, fill='black')
          image.save('/tmp/authorities-ocr.png')
          PY
      - name: Real OCR preparation to cached selectable geometry
        working-directory: backend
        env:
          MIKE_LOCAL_DATA_DIR: /tmp/authorities-highlight-local
          MIKE_PDF_LAYOUT_PROVIDER: none
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const { readFileSync } = require('node:fs');
          const { createHash } = require('node:crypto');
          const { PDFDocument } = require('pdf-lib');
          const { documentProjectionService: service } = require('./dist/lib/documentProjectionService');
          const { structureNative } = require('./dist/lib/structureNative');
          (async () => {
            const pdf = await PDFDocument.create();
            const image = await pdf.embedPng(readFileSync('/tmp/authorities-ocr.png'));
            pdf.addPage([700, 225]).drawImage(image, {x:0, y:0, width:700, height:225});
            const bytes = Buffer.from(await pdf.save());
            const reference = {documentId:'ocr-selection-fixture', versionId:'version-1', sourceSha256:createHash('sha256').update(bytes).digest('hex')};
            const prepared = await service.preparePdf({...reference, bytes, ocrProvider:'tesseract', layout:false});
            const profile = {cacheKey:prepared.cacheKey, profile:prepared.profile, status:prepared.status};
            let reads = 0;
            const read = () => {reads++; return bytes;};
            const pages = await service.pdfTextLayer(read, reference, {pdfProfile:profile});
            assert.equal(reads, 0, 'recognized text must use the prepared cache without reading/re-extracting source bytes');
            assert.equal(pages.length, 1);
            const words = pages[0].lines.flatMap(line => line.words);
            assert.match(words.map(word => word.text).join(' '), /Recognized words remain selectable/i);
            assert(words.every(word => word.rect.length === 4 && word.rect.every(Number.isFinite) && word.rect[2] > word.rect[0] && word.rect[3] > word.rect[1]));
            assert.equal(pages[0].pageNumber, 1);
            assert(Math.abs(pages[0].width - 700) < 1 && Math.abs(pages[0].height - 225) < 1);
            assert.deepEqual(await service.pdfTextLayer(read, reference, {pdfProfile:profile}), pages);
            assert.equal(reads, 0, 'repeat opening must reuse OCR geometry');
            assert.deepEqual(await service.pdfTextLayer(() => {throw new Error('manual-only source must not be read');}, reference), []);
            console.log(JSON.stringify({liveOcr:true, sourceReadsAfterPreparation:reads, pages:pages.length, selectableWords:words.length, text:words.map(word => word.text).join(' ')}));
          })().catch(error => {console.error(error); process.exitCode=1;});
          JS
      - name: Publish verified parser pin and remove temporary workflow
        run: |
          git diff --check
          rm .github/workflows/authorities-highlight-validation.yml
          git add legal-pdf-parser .github/workflows/authorities-highlight-validation.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: gate selectable OCR against the compiled parser and cached geometry'
          git push origin HEAD:fix/authorities-highlight-selection-ocr
          git rev-parse HEAD
