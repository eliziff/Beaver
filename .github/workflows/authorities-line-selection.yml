name: Authorities final selection integration
on:
  push:
    branches: [fix/authorities-highlight-selection-ocr]
    paths: [.github/workflows/authorities-line-selection.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      MIKE_PDF_LAYOUT_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply the locally validated line-only text path
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json
          changes=json.loads(r'''[["backend/src/lib/structureNative.ts", "ff378cb3e824b9237ff878da6bfab2b973f44b8b7cacdbc6cd2b50c61e78b6f9", "44f26ab9b3fa58b7ef56eddfa5f5ace3725db5a94c677947437dafe1f9aba439", [[94, 95, "  lines: Array<{ id: string; text?: string; rect: Rect; words: Array<{ text: string; rect: Rect }> }> };\n"]]], ["docs/current/authorities.md", "96ceffc6bbfdce8c29897dd7713b59082eec0771bcd99cef2cbd3d8608412eac", "5c37de7fd0f0fe4c3030388a35be800dd286df0e73be37a58b3a215cc521c7d3", [[69, 70, "including when reopening a draft. Word boxes are used when available; line-only\nrecognition retains its text and line box rather than inventing word coordinates.\nCompleted recognition updates the selectable\n"]]], ["frontend/src/app/components/shared/views/PdfCanvas.tsx", "59e323e4ae5f061e434ef8a37d9a1919405d1b3b7ecd03d876c31d18e608518e", "a20eeeac2fa90c4faf6a8596a9cd6a10a2ec494922cbc70efa9b0142b01aa75f", [[267, 268, "                    if (entry.textSource?.lines.some(line => line.words.length || line.text?.trim())) {\n"]]], ["frontend/src/app/components/shared/views/PdfView.test.tsx", "a27f4e0cc96453f661ab9d47583e7cc62c4a269556041f5f650197190d79e4f7", "8c35ab401f6f016f55760913e7cdcb37a2d0f89e37a5bf0b789c4e815d446cf2", [[234, 235, "                rect: [20, 30, 120, 45], words: [{ text: \"Recognized\", rect: [20, 30, 90, 45] }] },\n                { id: \"line-2\", text: \"Line-only recognition\", rect: [20, 50, 220, 65], words: [] }] }],\n"], [239, 239, "        expect(container.querySelector(\".pdf-text-layer\")?.textContent).toContain(\"Line-only recognition\");\n"]]], ["frontend/src/app/components/shared/views/pdfRecognizedText.ts", "2e1ae8e22dbee99d6fe27873573ffcb9829b31b43084daf0830a0f24eaa0f485", "ae593b93c102680b618b4df30d3a110bdc1aad06bc289d8293acbda52979104e", [[10, 11, "    // Line-only providers still supply a real text run and its measured line box.\n    const runs = source.words.length ? source.words : source.text?.trim()\n      ? [{ text: source.text, rect: source.rect }] : [];\n    for (const word of runs) {\n"]]], ["frontend/src/app/lib/api/documents.ts", "e3317b692c0b365387ffb214f41a4a7690f7d6bbe16abb0cf9f4c7f42464d6e5", "d6eca2e715c27c6ed301e4add659a4d393c2f1ac0794a5b549214b622e78afab", [[21, 22, "  lines: Array<{ id: string; text?: string; rect: [number, number, number, number];\n"]]]]''')
          for name,before,after,edits in changes:
            p=Path(name);old=p.read_bytes()
            assert hashlib.sha256(old).hexdigest()==before,(name,'source changed')
            lines=old.decode().splitlines(keepends=True)
            for start,end,text in reversed(edits):lines[start:end]=[text]
            result=''.join(lines).encode()
            assert hashlib.sha256(result).hexdigest()==after,(name,'patch mismatch')
            p.write_bytes(result)
      - name: Restore the exact producer and locked dependencies
        run: |
          git submodule update --init legal-pdf-parser legal-structure
          git -C legal-pdf-parser fetch origin 507566d5c6ed0da28250253b8a2fd2a597f6cbba
          git -C legal-pdf-parser checkout 507566d5c6ed0da28250253b8a2fd2a597f6cbba
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
          echo "LEGAL_STRUCTURE_NATIVE=$PWD/native/legal-structure-node/target/debug/liblegal_structure_node.so" >> "$GITHUB_ENV"
          echo "MIKE_LOCAL_DATA_DIR=$RUNNER_TEMP/authorities-selection-data" >> "$GITHUB_ENV"
          echo "HIGHLIGHT_RECEIPTS=$RUNNER_TEMP/authorities-selection-receipts" >> "$GITHUB_ENV"
      - name: Link the final native addon and build backend
        run: |
          cargo build --manifest-path native/legal-structure-node/Cargo.toml --lib --locked
          npm run build --prefix backend
      - name: Typecheck frontend and run the affected existing suites
        run: |
          (cd frontend && npx tsc --noEmit && npx vitest run src/app/components/shared/views/PdfView.test.tsx src/app/authorities/QuotationFinding.test.tsx src/app/authorities/standaloneHost.test.tsx)
          (cd backend && npx vitest run src/lib/__tests__/documentProjectionService.test.ts)
          npm run check:source-boundaries
      - name: Prepare a synthetic two-page scan
        run: |
          command -v tesseract || (sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr)
          python -m pip install --quiet pillow reportlab
          mkdir -p "$HIGHLIGHT_RECEIPTS"
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from reportlab.pdfgen import canvas
          from reportlab.lib.utils import ImageReader
          from io import BytesIO
          import os
          pdf=canvas.Canvas(os.path.join(os.environ['HIGHLIGHT_RECEIPTS'],'scan.pdf'),pagesize=(612,792))
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',36)
          for lines in [['Recognized words are selectable','Second scanned line remains aligned','Third line for reverse selection'],['This page was not selected for recognition','Do not run OCR on an unrequested page']]:
              image=Image.new('RGB',(1224,1584),'white');draw=ImageDraw.Draw(image)
              for i,line in enumerate(lines):draw.text((120,160+100*i),line,fill='black',font=font)
              buffer=BytesIO();image.save(buffer,format='PNG');buffer.seek(0)
              pdf.drawImage(ImageReader(buffer),0,0,width=612,height=792);pdf.showPage()
          pdf.save()
          PY
      - name: Real OCR to selectable geometry and fresh-process restore
        run: |
          cat > "$HIGHLIGHT_RECEIPTS/verify.cjs" <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path');
          const {createHash}=require('node:crypto'),{execFileSync}=require('node:child_process');
          const {documentProjectionService:service}=require(path.resolve('backend/dist/lib/documentProjectionService.js'));
          const root=process.env.HIGHLIGHT_RECEIPTS;
          const neverRead=()=>{throw Error('A cached text layer must not reread or re-OCR source bytes');};
          (async()=>{
            if(process.argv[2]==='restore'){
              const {reference,profile}=JSON.parse(fs.readFileSync(path.join(root,'reference.json')));
              assert.deepEqual({pages:await service.pdfTextLayer(neverRead,reference,{pdfProfile:profile})},JSON.parse(fs.readFileSync(path.join(root,'ocr.json'))));
              console.log('PASS: fresh-process restoration without source rereading or OCR');return;
            }
            const bytes=fs.readFileSync(path.join(root,'scan.pdf'));
            const reference={documentId:'highlight-scan',versionId:'v1',sourceSha256:createHash('sha256').update(bytes).digest('hex')};
            assert.deepEqual(await service.pdfTextLayer(neverRead,reference),[]);
            const prepared=await service.preparePdf({...reference,bytes,pages:[1],ocrProvider:'tesseract',layout:false});
            assert.equal(prepared.pageCount,2);assert.deepEqual(prepared.ocrRoutedPages,[0]);
            const profile={profile:prepared.profile,cacheKey:prepared.cacheKey,status:prepared.status};reference.cacheKey=prepared.cacheKey;
            const pages=await service.pdfTextLayer(neverRead,reference,{pdfProfile:profile});
            fs.writeFileSync(path.join(root,'ocr.json'),JSON.stringify({pages},null,2));
            fs.writeFileSync(path.join(root,'reference.json'),JSON.stringify({reference,profile},null,2));
            const page=pages.find(page=>page.pageNumber===1);assert.ok(page?.lines.length);
            const words=page.lines.flatMap(line=>line.words),text=words.map(word=>word.text).join(' ');
            assert.match(text,/Recognized words are selectable/);assert.match(text,/Second scanned line remains aligned/);
            assert.ok(!pages.some(page=>page.pageNumber===2&&page.lines.some(line=>line.words.length||line.text?.trim())));
            for(const word of words){assert.ok(word.rect.every(Number.isFinite));assert.ok(word.rect[2]>word.rect[0]&&word.rect[3]>word.rect[1]);assert.ok(word.rect[0]>=0&&word.rect[1]>=0&&word.rect[2]<=page.width&&word.rect[3]<=page.height);}
            fs.writeFileSync(path.join(root,'result.json'),JSON.stringify({parser:'507566d5c6ed0da28250253b8a2fd2a597f6cbba',recognizedWords:words.length,text,recognizedPages:[1],unrequestedPageRecognized:false},null,2));
            console.log('PASS: real Tesseract words reach viewer geometry; page 2 remains unrecognized',text);
            execFileSync(process.execPath,[__filename,'restore'],{stdio:'inherit',env:process.env});
          })().catch(error=>{console.error(error);process.exitCode=1;});
          JS
          node "$HIGHLIGHT_RECEIPTS/verify.cjs"
      - name: Publish the verified changes without temporary workflows
        run: |
          git diff --check
          rm .github/workflows/authorities-line-selection.yml
          if test -f .github/workflows/authorities-highlight-validation.yml; then rm .github/workflows/authorities-highlight-validation.yml; fi
          git add legal-pdf-parser backend/src/lib/structureNative.ts docs/current/authorities.md frontend/src/app/components/shared/views/PdfCanvas.tsx frontend/src/app/components/shared/views/PdfView.test.tsx frontend/src/app/components/shared/views/pdfRecognizedText.ts frontend/src/app/lib/api/documents.ts .github/workflows/authorities-line-selection.yml .github/workflows/authorities-highlight-validation.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: finish Authorities OCR selection with the validated native producer'
          git push origin HEAD:fix/authorities-highlight-selection-ocr
          git rev-parse HEAD | tee "$HIGHLIGHT_RECEIPTS/candidate-sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorities-final-ocr-receipt
          path: ${{ runner.temp }}/authorities-selection-receipts/
          retention-days: 1
