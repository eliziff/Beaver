name: Authorities regression workspace
on:
  push:
    branches: [fix/authorities-ocr-loading-crash]
    paths: [.github/workflows/authorities-regression-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: authorities-schema
          path: backend/schema.sql
          retention-days: 1
