name: Authorities OCR and crash regression validation
on:
  push:
    branches: [fix/authorities-ocr-loading-crash]
    paths: [.github/workflows/authorities-regression-workspace.yml]
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      MIKE_PDF_LAYOUT_PROVIDER: none
      AUTH_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install exact dependencies and record baseline frontend diagnostics
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm run build --prefix backend
          (cd frontend && npx tsc --noEmit > /tmp/authorities-baseline-types.log 2>&1) || test "$?" = 2
      - name: Apply reviewed changes and validate corrected domain fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          s=Path('.github/authorities-candidate.py').read_text().replace('d1a23ee41435f10691a61d37cfb09f156274b4aefcbfc57fcd933ba24d47cbb','b82407e1ebd13f2280a9dbf4fe74848c67a6ce9fc54cd56bc5eacbe6d0e67f01')
          exec(compile(s,'.github/authorities-candidate.py','exec'))
          p=Path('frontend/src/app/authorities/AuthoritiesHighlightEditor.test.tsx');s=p.read_text()
          s=s.replace('import { createAuthoritiesDraft }','import { createAuthoritiesDraft, validateAuthoritiesDraft }')
          s=s.replace("passageMarking = 'highlight'","passageMarking = 'text'").replace("origin: 'uploaded'","origin: 'manual'")
          s=s.replace('  const product: AuthoritiesProduct =', '''  for (const id of draft.authorityOrder) draft.bindings[id] = { kind: 'document', documentId: id,
              version: { versionId: `version-${id}`, sha256: hash } };
            expect(validateAuthoritiesDraft(draft)).toEqual([]);
            const product: AuthoritiesProduct =''')
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='7b8e8f133b0a8656cf46adb740331743714ef1c568ad8ca721e06864334f3223'
          p=Path('.github/authorities-live-check.cjs');s=p.read_text()
          s=s.replace("passageMarking='highlight'","passageMarking='text'").replace("origin:'uploaded'","origin:'manual'")
          p.write_text(s)
          PY
          git diff --check
          git submodule update --init legal-pdf-parser legal-structure
          echo "LEGAL_STRUCTURE_NATIVE=$PWD/native/legal-structure-node/target/debug/liblegal_structure_node.so" >> "$GITHUB_ENV"
          echo "MIKE_LOCAL_DATA_DIR=$RUNNER_TEMP/authorities-regression-data" >> "$GITHUB_ENV"
          echo "HIGHLIGHT_RECEIPTS=$RUNNER_TEMP/authorities-regression-receipt" >> "$GITHUB_ENV"
      - name: Link the unchanged native producer for the real lifecycle gate
        run: cargo build --manifest-path native/legal-structure-node/Cargo.toml --lib --locked
      - name: Typecheck and run focused tests
        run: |
          npm run build --prefix backend
          (cd frontend && npx tsc --noEmit > /tmp/authorities-candidate-types.log 2>&1) || test "$?" = 2
          diff -u /tmp/authorities-baseline-types.log /tmp/authorities-candidate-types.log
          if test -s /tmp/authorities-candidate-types.log; then
            echo '::warning::Frontend has unchanged baseline diagnostics; no additional candidate diagnostics'
            cat /tmp/authorities-candidate-types.log
          fi
          (cd frontend && npx vitest run src/app/components/shared/views/PdfView.test.tsx src/app/authorities/AuthoritiesHighlightEditor.test.tsx src/app/authorities/standaloneHost.test.tsx src/app/authorities/QuotationFinding.test.tsx)
          (cd backend && npx vitest run src/lib/__tests__/pdfOcrHandoff.test.ts src/lib/authoritiesWorkspaceApplication.test.ts src/lib/__tests__/documentProjectionService.test.ts)
          npm run check:source-boundaries
      - name: Prepare controlled scan and actual browser stylesheet entry
        run: |
          command -v tesseract || (sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr)
          python -m pip install --quiet pillow playwright
          python -m playwright install --with-deps chromium
          mkdir -p "$HIGHLIGHT_RECEIPTS" frontend/.regression
          sed 's@/base.css@/globals.css@' .github/authorities-browser-main.tsx > frontend/.regression/main.tsx
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"></head><body><div id="root"></div><script type="module" src="/.regression/main.tsx"></script></body></html>' > frontend/.regression/index.html
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          import os
          image=Image.new('RGB',(1224,1584),'white');draw=ImageDraw.Draw(image)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',36)
          for i,text in enumerate(['Recognized words are selectable','Second scanned line remains aligned','Third line for reverse selection']):
              draw.text((120,160+100*i),text,fill='black',font=font)
          image.save(Path(os.environ['HIGHLIGHT_RECEIPTS'])/'scan.png')
          PY
      - name: Real worker to persisted descriptor to HTTP to embedded Authorities selection
        run: |
          node .github/authorities-live-check.cjs > "$HIGHLIGHT_RECEIPTS/native.log" 2>&1 & native=$!
          (cd frontend && BEAVER_API_ORIGIN=http://127.0.0.1:3037 node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 3036) > "$HIGHLIGHT_RECEIPTS/vite.log" 2>&1 & vite=$!
          trap 'kill "$native" "$vite" 2>/dev/null || true' EXIT
          ready=false
          for n in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3037/api/fixture >/dev/null && curl -fsS http://127.0.0.1:3036/.regression/index.html >/dev/null; then ready=true; break; fi
            if ! kill -0 "$native" 2>/dev/null; then cat "$HIGHLIGHT_RECEIPTS/native.log"; exit 1; fi
            sleep 1
          done
          test "$ready" = true
          python .github/authorities-browser-check.py
          cat "$HIGHLIGHT_RECEIPTS/native.log"
      - name: Publish only the gated production, test and documentation changes
        run: |
          git diff --check
          while IFS= read -r path || test -n "$path"; do git add -- "$path"; done < /tmp/authorities-changed-files.txt
          git rm -f .github/authorities-candidate.py .github/authorities-live-check.cjs .github/authorities-browser-main.tsx .github/authorities-browser-check.py .github/workflows/authorities-regression-workspace.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: retain Authorities OCR handoffs and eliminate PDF gap freezes'
          git push origin HEAD:fix/authorities-ocr-loading-crash
          git rev-parse HEAD | tee "$HIGHLIGHT_RECEIPTS/candidate-sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorities-ocr-crash-regression-receipt
          path: |
            ${{ runner.temp }}/authorities-regression-receipt/
            /tmp/authorities-baseline-types.log
            /tmp/authorities-candidate-types.log
          retention-days: 3
