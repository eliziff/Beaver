name: Focused database and event validation
on:
  push:
    branches: [codex/database-event-efficiency]
    paths: [.github/workflows/database-workbench.yml]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: event-fixture-only
          POSTGRES_DB: event_tests
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Read exact public candidate
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/eliziff/Beaver.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          mkdir -p .database-validation
          git rev-parse HEAD > .database-validation/validated-sha.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend tooling only
        run: npm ci --ignore-scripts --prefix backend
      - name: Recheck the two changed database test files only
        run: |
          (cd backend && npx vitest run src/lib/__tests__/sqliteStatements.test.ts src/lib/__tests__/jobEventBatching.test.ts) 2>&1 | tee .database-validation/sqlite-tests.log
      - name: Same event-write cases on real PostgreSQL
        if: ${{ !cancelled() }}
        env:
          BEAVER_TEST_POSTGRES_URL: postgres://postgres:event-fixture-only@127.0.0.1:5432/event_tests?sslmode=disable
        run: (cd backend && npx vitest run src/lib/__tests__/jobEventBatching.test.ts) 2>&1 | tee .database-validation/postgres-tests.log
      - name: Backend type checking only
        if: ${{ !cancelled() }}
        run: |
          (cd backend && npx tsc --noEmit --incremental false) 2>&1 | tee .database-validation/types.log
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: database-event-focused
          include-hidden-files: true
          path: .database-validation
          retention-days: 7
