name: Steering cancellation validation
on:
  push:
    branches: [codex/fix-steering-cancellation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      NO_COLOR: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: cancellation-fixture-only
          POSTGRES_DB: cancellation_tests
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out public candidate without initializing orphan submodules
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/eliziff/Beaver.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          mkdir -p .cancellation-validation
          git rev-parse HEAD > .cancellation-validation/validated-sha.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci --ignore-scripts --prefix backend
      - name: Backend compilation
        run: npm run build --prefix backend 2>&1 | tee .cancellation-validation/build.log
      - name: Cancellation, queue, command and provider regressions
        if: ${{ !cancelled() }}
        run: |
          (cd backend && npx vitest run src/lib/chatTurns.test.ts src/lib/__tests__/chatCancellation.test.ts src/lib/__tests__/chatCommands.test.ts src/lib/__tests__/jobScheduling.test.ts src/lib/__tests__/jobQueue.test.ts src/lib/__tests__/chatTurnTransport.test.ts src/lib/jobNotifications.test.ts src/lib/llm/providerLoop.test.ts src/lib/llm/codex.test.ts src/lib/chat/turnEngine.test.ts src/index.test.ts src/server.test.ts) 2>&1 | tee .cancellation-validation/tests.log
      - name: Prove the new cleanup regression fails on unchanged pinned main
        if: ${{ !cancelled() }}
        run: |
          git fetch --depth=1 origin 061e13b42105002e0980cac9a1cae30fbbd6eef7
          git worktree add --detach .cancellation-baseline FETCH_HEAD
          cmp backend/package-lock.json .cancellation-baseline/backend/package-lock.json
          ln -s "$PWD/backend/node_modules" .cancellation-baseline/backend/node_modules
          cp backend/src/lib/__tests__/chatCancellation.test.ts .cancellation-baseline/backend/src/lib/__tests__/
          set +e
          (cd .cancellation-baseline/backend && npx vitest run src/lib/__tests__/chatCancellation.test.ts --testTimeout=6000) 2>&1 | tee .cancellation-validation/baseline-regression.log
          status=${PIPESTATUS[0]}
          set -e
          echo "Pinned-main regression exit status: $status" | tee .cancellation-validation/baseline-status.txt
          test "$status" -ne 0
          grep -q 'Steering held turn cleanup open' .cancellation-validation/baseline-regression.log
      - name: Real-process IPC and PostgreSQL delivery regressions
        if: ${{ !cancelled() }}
        env:
          QUEUE_TEST_DATABASE_URL: postgres://postgres:cancellation-fixture-only@127.0.0.1:5432/cancellation_tests?sslmode=disable
        run: node scripts/test-job-delivery.mjs .cancellation-validation/delivery.json 2>&1 | tee .cancellation-validation/delivery.log
      - name: Source boundaries and whitespace
        if: ${{ !cancelled() }}
        run: |
          node scripts/check-source-boundaries.mjs 2>&1 | tee .cancellation-validation/boundaries.log
          git diff --check 061e13b42105002e0980cac9a1cae30fbbd6eef7 HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: steering-cancellation-validation
          include-hidden-files: true
          path: .cancellation-validation
          retention-days: 7
