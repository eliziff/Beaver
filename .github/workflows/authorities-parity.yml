name: Authorities parity
on:
  workflow_call:
    inputs:
      native-artifact:
        required: true
        type: string
      backend-artifact:
        required: true
        type: string
      repositories:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: authorities-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared-runtime-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BEAVER_REPOSITORY_REFS: ${{ inputs.repositories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore this run's owner source checkouts
        run: python3 scripts/bootstrap-repositories.py legal-structure legal-pdf-parser common-law-cite AuthoritiesHelper
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix backend
          npm ci --ignore-scripts --prefix frontend
      - name: Gate native citation and quotation semantics
        run: cargo test --locked --jobs 2 --manifest-path legal-structure/Cargo.toml --features citator,quote-verification --lib
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: inputs.native-artifact != ''
        with:
          name: ${{ inputs.native-artifact }}
          path: native/legal-structure-node/target/release
      - name: Build native integration for a standalone manual run
        if: inputs.native-artifact == ''
        run: cargo build --locked --release --jobs 2 --manifest-path native/legal-structure-node/Cargo.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: inputs.backend-artifact != ''
        with:
          name: ${{ inputs.backend-artifact }}
          path: .
      - name: Build both TypeScript surfaces for a standalone manual run
        if: inputs.backend-artifact == ''
        run: |
          npm run build --prefix backend
      - name: Verify package assembly
        run: npm run test:authorities-package
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify visual quotation review and editable PDF highlights
        env:
          AUTHORITIES_HIGHLIGHT_OUTPUT: authorities-browser-results/highlights
        run: npm run test:authorities:highlights
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: authorities-browser-evidence
          path: authorities-browser-results/
          retention-days: 7
          if-no-files-found: ignore
