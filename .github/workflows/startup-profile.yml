name: Startup validation
on:
  push:
    branches: [codex/performance-cold-load]
    paths: [.github/workflows/startup-profile.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out candidate and pinned comparisons without submodule initialization
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/eliziff/Beaver.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          mkdir -p .perf
          for entry in previous:2b8dcb66dd256735e8defbe163e803fff2ac8141 original:bd896cb8a06af9f472feefa3875d65d579235263; do
            name=${entry%%:*}; sha=${entry#*:}
            git fetch --depth=1 origin "$sha"
            git worktree add --detach ".baseline-$name" "$sha"
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix frontend
          npm ci --ignore-scripts --prefix backend
          for name in previous original; do
            cmp frontend/package-lock.json ".baseline-$name/frontend/package-lock.json"
            ln -s "$PWD/frontend/node_modules" ".baseline-$name/frontend/node_modules"
          done
      - name: Backend build and focused HTTP regressions
        run: |
          npm run build --prefix backend 2>&1 | tee .perf/backend-build.log
          (cd backend && npx vitest run src/lib/precompressedAssets.test.ts src/server.test.ts) 2>&1 | tee .perf/backend-tests.log
      - name: Production builds and standalone boundaries
        if: ${{ !cancelled() }}
        run: npm run build --prefix frontend 2>&1 | tee .perf/frontend-build.log
      - name: Build pinned previous PR and original main
        if: ${{ !cancelled() }}
        run: |
          for name in previous original; do
            (cd ".baseline-$name/frontend" && npx vite build --outDir "../../.perf/$name" --emptyOutDir) 2>&1 | tee ".perf/$name-build.log"
          done
      - name: Browser regressions and matched cold/loopback comparisons
        if: ${{ !cancelled() }}
        run: |
          npx playwright install --with-deps chromium
          node scripts/test-cold-load.mjs frontend/dist .perf/previous .perf/report 2>&1 | tee .perf/browser.log
          node scripts/test-cold-load.mjs frontend/dist .perf/original .perf/report-original 2>&1 | tee .perf/browser-original.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: startup-browser-validation
          include-hidden-files: true
          path: |
            .perf/*.log
            .perf/report
            .perf/report-original
          retention-days: 7
      - name: Frontend tests
        if: ${{ !cancelled() }}
        run: npm test --prefix frontend 2>&1 | tee .perf/frontend-tests.log
      - name: Source boundaries
        if: ${{ !cancelled() }}
        run: npm run check:source-boundaries 2>&1 | tee .perf/source-boundaries.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: startup-validation
          include-hidden-files: true
          path: |
            .perf/*.log
            .perf/report
            .perf/report-original
          retention-days: 7
