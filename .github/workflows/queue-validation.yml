name: Queue validation
on:
  push:
    branches: [codex/queue-isolation-events]
    paths: [.github/workflows/queue-validation.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read public pinned sources without initializing orphan submodules
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/eliziff/Beaver.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          git archive --format=tar HEAD backend/src backend/schema.sql backend/package.json backend/package-lock.json backend/tsconfig.json backend/vitest.config.mts scripts/check-source-boundaries.mjs scripts/check-typescript-surface.mjs docs/roadmap/master-plan.md AGENTS.md subrepos.lock.json > queue-source.tar
          find backend scripts -name AGENTS.md -print -exec cat {} \; > nested-agents.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queue-source
          path: |
            queue-source.tar
            nested-agents.txt
          retention-days: 7
