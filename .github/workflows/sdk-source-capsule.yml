name: SDK contracts validation
on:
  push:
    branches: [refactor/sdk-contracts-compaction]
    paths: [.github/workflows/sdk-source-capsule.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'eliziff/Beaver' && github.ref == 'refs/heads/refactor/sdk-contracts-compaction'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply exact reviewed source patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = ''.join(Path(f'.github/sdk-contracts-{i}.b64').read_text().strip() for i in range(3))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd0460f20ec1afd249f5e34363612573f77d12f961b41df1355553e9c9b126735'
          Path(os.environ['RUNNER_TEMP'], 'sdk-contracts.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/sdk-contracts.patch"
          git apply "$RUNNER_TEMP/sdk-contracts.patch"
          git diff --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --prefix backend --ignore-scripts
      - run: npm run build --prefix backend
      - name: Focused backend SDK and state checks
        working-directory: backend
        run: npx vitest run src/lib/llm/sdk.test.ts src/lib/chat/toolRegistry.test.ts src/lib/chat/contextCompaction.test.ts src/lib/chat/chatTranscript.test.ts src/lib/__tests__/claudeP.test.ts
      - run: npm ci --prefix frontend --ignore-scripts
      - name: Focused frontend compaction and transcript checks
        working-directory: frontend
        run: npx vitest run src/app/components/assistant/AssistantMessage.activity.test.tsx src/app/hooks/useAssistantChat.test.ts src/app/lib/assistantSession.test.ts src/app/lib/assistantStream.test.ts
      - name: Publish source without workbench files
        run: |
          rm .github/sdk-contracts-0.b64 .github/sdk-contracts-1.b64 .github/sdk-contracts-2.b64 .github/workflows/sdk-source-capsule.yml
          git add -- backend/src/lib/__tests__/claudeP.test.ts backend/src/lib/chat/__tests__/legalEvidence.test.ts backend/src/lib/chat/assistantWire.ts backend/src/lib/chat/chatApplication.ts backend/src/lib/chat/contextCompaction.test.ts backend/src/lib/chat/contextCompaction.ts backend/src/lib/chat/legalEvidence.ts backend/src/lib/chat/toolRegistry.test.ts backend/src/lib/chat/toolRegistry.ts backend/src/lib/chat/tools/toolSchemas.ts backend/src/lib/chat/turnEngine.test.ts backend/src/lib/chat/turnEngine.ts backend/src/lib/llm/README.md backend/src/lib/llm/claudeP.ts backend/src/lib/llm/index.ts backend/src/lib/llm/sdk.test.ts backend/src/lib/llm/sdk.ts backend/src/lib/llm/sdkProviders.ts backend/src/lib/llm/structured.ts backend/src/lib/llm/types.ts backend/src/lib/tabular/extraction.ts backend/src/lib/tabular/jev.ts docs/current/tool-runtime.md frontend/src/app/components/assistant/AssistantMessage.activity.test.tsx frontend/src/app/components/assistant/AssistantMessage.tsx frontend/src/app/hooks/useAssistantChat.test.ts frontend/src/app/hooks/useAssistantChat.ts frontend/src/app/lib/api/chat.ts frontend/src/app/lib/assistantSession.ts .github/sdk-contracts-0.b64 .github/sdk-contracts-1.b64 .github/sdk-contracts-2.b64 .github/workflows/sdk-source-capsule.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use SDK steps, strict model contracts and inspectable compaction'
          git push origin HEAD:refactor/sdk-contracts-compaction
      - name: Record frontend typecheck independently
        if: success()
        working-directory: frontend
        run: npx tsc --noEmit
