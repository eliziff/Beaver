name: Document engine admission oracle

on:
  pull_request:
    paths:
      - 'backend/experiments/document-engine-admission/**'
      - '.github/workflows/document-engine-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test physical package-preservation checks (no engine or model)
        run: python3 -m unittest discover -s backend/experiments/document-engine-admission -p 'test_*.py' -v
