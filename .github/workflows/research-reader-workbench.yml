name: Research reader workbench
on:
  push:
    branches: [codex/research-findings-reader]
    paths: ['.github/workflows/research-reader-workbench.yml', '.research-reader/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-reader-workbench
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Export exact checkout
        run: |
          git ls-files '*research*test*' '*sourceWorkspace*test*' '*vitest*'
          find backend/src -iname '*research*test*' -o -iname '*sourceWorkspace*test*'
          tar -czf /tmp/research-checkout.tgz --exclude=backend/dist --exclude=backend/.cache backend shared packages native scripts subrepos.lock.json tsconfig.json package.json AGENTS.md
      - uses: actions/upload-artifact@v4
        with: { name: research-checkout, path: /tmp/research-checkout.tgz, retention-days: 1 }
