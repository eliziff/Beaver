name: SDK refactor implementation
on:
  push:
    branches: [refactor/sdk-agent-state]
    paths: [.github/workflows/sdk-refactor-workbench.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'eliziff/Beaver' && github.ref == 'refs/heads/refactor/sdk-agent-state'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply the tested implementation
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          data = ''.join(Path('.github/sdk-refactor', f'{n}.b64').read_text() for n in range(2))
          patch = lzma.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4902f6238ecd36149e44508dc094949d0cdbe69037766eb5d57e042f8ede1e22'
          Path(os.environ['RUNNER_TEMP'], 'implementation.patch').write_bytes(patch)
          PY
          git apply --index --binary "$RUNNER_TEMP/implementation.patch"
          python - <<'PY'
          from pathlib import Path
          import json
          def replace(path, old, new):
              p = Path(path)
              value = p.read_text()
              assert old in value, path
              p.write_text(value.replace(old, new))
          replace('backend/src/lib/spreadsheet.ts', 'import { z } from "zod";', 'import { z } from "zod/v4";')
          replace('backend/src/lib/chat/tools/toolSchemas.ts', 'import { zodToJsonSchema } from "zod-to-json-schema";', 'import { z } from "zod/v4";')
          replace('backend/src/lib/chat/tools/toolSchemas.ts', 'zodToJsonSchema(workbookSheetsSchema, { $refStrategy: "none" })', 'z.toJSONSchema(workbookSheetsSchema, { target: "draft-7" })')
          for path in ['backend/package.json', 'backend/package-lock.json']:
              p = Path(path)
              data = json.loads(p.read_text())
              deps = data['dependencies'] if path.endswith('/package.json') else data['packages']['']['dependencies']
              assert deps.pop('zod-to-json-schema', None)
              p.write_text(json.dumps(data, indent=2) + '\n')
          for name in ['openai', 'claude', 'gemini']:
              replace('docs/decisions/document-mutation.md', f'../../backend/src/lib/llm/{name}.ts', f'https://github.com/eliziff/Beaver/blob/883aa5b46d7f693a6b665577bdd1c0479365a04d/backend/src/lib/llm/{name}.ts')
          PY
          git add backend/src/lib/spreadsheet.ts backend/src/lib/chat/tools/toolSchemas.ts backend/package.json backend/package-lock.json docs/decisions/document-mutation.md
          git rm backend/src/lib/llm/{anthropicWire.ts,claude.ts,deepseek.ts,gemini.ts,geminiWire.test.ts,geminiWire.ts,ollamaApi.ts,openai.ts,openaiCompatibleWire.ts,openaiResponsesWire.ts,providerLoop.test.ts,providerLoop.ts,wireAdapters.test.ts}
          git rm .github/workflows/sdk-refactor-workbench.yml .github/sdk-refactor/{0,1}.b64
          git diff --cached --check
      - run: npm ci --prefix backend --ignore-scripts
      - run: npm run build --prefix backend
      - name: Run focused behavior and native-transport contract tests
        working-directory: backend
        run: node node_modules/vitest/vitest.mjs run src/lib/llm/sdk.test.ts src/lib/chat/chatTranscript.test.ts src/lib/chat/contextCompaction.test.ts src/lib/__tests__/spreadsheet.test.ts src/lib/chat/__tests__/documentOps.test.ts src/lib/llm/__tests__ src/lib/llm/codex.test.ts src/lib/__tests__/claudeP.test.ts src/lib/__tests__/ollamaApi.test.ts src/lib/__tests__/llmModels.test.ts src/lib/chat/toolRegistry.test.ts --reporter=dot
      - name: Commit implementation and remove the temporary workbench
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: replace provider wire engines with SDK replay and native workbook cells'
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *) echo "$GH_TOKEN";; esac\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refactor/sdk-agent-state
          git show --stat --oneline HEAD
