name: Cold-load validation
on:
  push:
    branches: [codex/performance-cold-load]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate and pinned baseline without initializing submodules
        run: |
          # The repository has an orphan OpenLegalData gitlink. Ordinary checkout
          # works; actions/checkout's recursive credential cleanup does not.
          # Both snapshots are public: no token or persisted credentials needed.
          git init .
          git remote add origin https://github.com/eliziff/Beaver.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git init .baseline
          git -C .baseline remote add origin https://github.com/eliziff/Beaver.git
          git -C .baseline fetch --depth=1 origin bd896cb8a06af9f472feefa3875d65d579235263
          git -C .baseline checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        id: install
        run: |
          mkdir -p .perf/report
          npm ci
          npm ci --prefix frontend
          npm ci --prefix .baseline/frontend
      - name: Frontend tests
        run: npm test --prefix frontend 2>&1 | tee .perf/frontend-tests.log
      - name: Production build and standalone boundaries
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build --prefix frontend 2>&1 | tee .perf/frontend-build.log
      - name: Build pinned baseline
        id: baseline
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: .baseline/frontend
        run: npx vite build --outDir ../../.perf/baseline --emptyOutDir 2>&1 | tee ../../.perf/baseline-build.log
      - name: Browser regression and cold comparison
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.baseline.outcome == 'success' }}
        run: |
          npx playwright install --with-deps chromium
          node scripts/test-cold-load.mjs frontend/dist .perf/baseline .perf/report 2>&1 | tee .perf/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-load-validation
          include-hidden-files: true
          retention-days: 7
          path: |
            .perf/*.log
            .perf/report
