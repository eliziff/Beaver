name: Publish verified performance closeout
on:
  push:
    branches: [codex/performance-closeout-final]
    paths: [.github/workflows/publish-performance-closeout.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconstruct and publish exact reviewed files only (no tests or builds)
        env:
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/eliziff/Beaver.git
          git fetch --depth=100 origin "$SOURCE_SHA"
          git checkout -b codex/performance-closeout-final FETCH_HEAD
          test "$(git rev-parse HEAD^)" = 2312e060fbde236e1f5d030e4c92bb1571aa1f3a
          git fetch --depth=100 origin e965a1ab642b85d7e48fbe211f40f39f6bbc05b6
          git worktree add --detach /tmp/performance-assembly e965a1ab642b85d7e48fbe211f40f39f6bbc05b6
          for sha in 8d6cf50da6a3a79255569b4ea85ae357436cdce4 5c12592e64b940e9f3b542ec8261fd6dc908d324 c5676e0b8f17e9edaa8da8cd4da4e7bde0d366fb 6beb34101da1694a319af65fcdc0fa0702ff0120; do
            git fetch --depth=100 origin "$sha"
            git diff e965a1ab642b85d7e48fbe211f40f39f6bbc05b6..."$sha" -- backend frontend shared scripts docs | git -C /tmp/performance-assembly apply
          done
          python3 - <<'PY'
          import urllib.request, json, base64, gzip, hashlib, subprocess, os
          from pathlib import Path, PurePosixPath
          assembly = Path('/tmp/performance-assembly')
          def blob(sha):
              url = 'https://api.github.com/repos/eliziff/Beaver/git/blobs/' + sha
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return base64.b64decode(json.load(response)['content'])
          def decode(shas):
              return gzip.decompress(base64.b64decode(b''.join(blob(sha) for sha in shas), validate=True))
          patches = [
              (['7ea7c92d6386dd0fec8dfdf6758e472d7793a221','bc09eff3329d06b3445614ad1db9443d590f474b','8dcc35ddd8b3f079ebc34c297e5e2eb6139e5dd5','0da4730502d1986012645b8055b9b9b6f9165ef0'], 'c26e5ed717209885d31eb8f0b27955fee4284ee5db0c7a2c174655866918956f'),
              (['628fcb40de7f23f3bfefddd67f245526d946fa57','7d0f71a572e9f51100b1a99c95e0aea3131db98d'], '2ba95c147e5737d7a324abadb8f2f1269b7b53399c41ba625fa295f8ef78f48d'),
          ]
          for shas, digest in patches:
              patch = decode(shas)
              assert hashlib.sha256(patch).hexdigest() == digest
              subprocess.run(['git','apply','--check'],cwd=assembly,input=patch,check=True)
              subprocess.run(['git','apply'],cwd=assembly,input=patch,check=True)
          data = decode(['4e44f9eb2d161435bb98e29ffc462cc441bc0f61','77d1290a8a6f72a842c838ab097214e548709824','0924ddb2028f76d5f723b6859632a184a5ae471c'])
          assert hashlib.sha256(data).hexdigest() == '6e1c3b86bc22b8badf6251046727a33ab7bf9ea30959b48cc0bc60f04a39ae9b'
          result = json.loads(data)
          assert result['base'] == '2312e060fbde236e1f5d030e4c92bb1571aa1f3a'
          patch = result['patch'].encode()
          subprocess.run(['git','apply','--check'],cwd=assembly,input=patch,check=True)
          subprocess.run(['git','apply'],cwd=assembly,input=patch,check=True)
          assert len(result['files']) == 30
          for name, digest in result['files'].items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in ('backend','frontend','docs','scripts')
              source = assembly/name
              assert source.is_file() and not source.is_symlink()
              content = source.read_bytes()
              assert hashlib.sha1(('blob '+str(len(content))+'\0').encode()+content).hexdigest() == digest, name
              destination = Path(name)
              assert not destination.is_symlink()
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(content)
          subprocess.run(['git','add','--',*result['files']],check=True)
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0'))
          assert changed == set(result['files']), changed
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('All 30 published files match the locally tested source manifest.')
          Path('/tmp/performance-published-manifest.json').write_text(json.dumps(result['files'],indent=2))
          PY
          git config user.name 'Codex'
          git config user.email 'codex@users.noreply.github.com'
          git commit -m 'Finish performance closeout: SQLite isolation, verified PDF ranges and intent prefetch [skip ci]'
          token=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $token" push origin HEAD:refs/heads/codex/performance-closeout-final
