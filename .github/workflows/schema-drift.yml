name: Schema drift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: schema-drift-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  # Beaver's first cloud baseline. Earlier Mike schemas are not a supported
  # Beaver upgrade path.
  BASELINE_REF: 3d4a8b87f4c9a850c6169bfa6b3a3c0ed28ea9c6

jobs:
  drift:
    name: Fresh install vs upgraded Beaver deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0

      - name: Start local Supabase
        run: |
          supabase init
          supabase start -x studio,imgproxy,inbucket,analytics,vector,realtime,storage,edge-runtime,functions,meta

      - name: Export database connection
        run: |
          STATUS="$(supabase status -o json)"
          DB_URL="$(node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).DB_URL??'')))" <<<"$STATUS")"
          echo "SUPABASE_TEST_DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Build and fingerprint both installation paths
        run: |
          set -euo pipefail
          test -n "$SUPABASE_TEST_DB_URL"

          reset_public() {
            psql "$SUPABASE_TEST_DB_URL" -X --set ON_ERROR_STOP=1 \
              -c 'drop schema public cascade;' \
              -c 'create schema public;' \
              -c 'grant usage on schema public to anon, authenticated, service_role;'
          }
          fingerprint() {
            psql "$SUPABASE_TEST_DB_URL" -XAtq --set ON_ERROR_STOP=1 \
              -f backend/scripts/schema-fingerprint.sql > "$1"
          }

          reset_public
          git show "$BASELINE_REF:backend/schema.sql" > /tmp/baseline-schema.sql
          psql "$SUPABASE_TEST_DB_URL" -X --set ON_ERROR_STOP=1 \
            --file /tmp/baseline-schema.sql
          while IFS= read -r migration; do
            test -z "$migration" || psql "$SUPABASE_TEST_DB_URL" -X \
              --set ON_ERROR_STOP=1 --file "$migration"
          done < <(git diff --name-only --diff-filter=A "$BASELINE_REF" HEAD \
            -- backend/migrations | LC_ALL=C sort)
          fingerprint /tmp/upgraded.txt

          reset_public
          psql "$SUPABASE_TEST_DB_URL" -X --set ON_ERROR_STOP=1 \
            --file backend/schema.sql
          fingerprint /tmp/fresh.txt

      - name: Compare schemas
        run: |
          diff -u /tmp/upgraded.txt /tmp/fresh.txt || {
            echo '::error::backend/schema.sql and the Beaver migration path have drifted apart.'
            exit 1
          }
