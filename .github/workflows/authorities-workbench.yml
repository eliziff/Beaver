name: Authorities workbench
on:
  push:
    branches: [fix/authorities-parity-workflow]
    paths: [.github/workflows/authorities-workbench.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out public source without credentials
        run: |
          git init .
          git remote add origin https://github.com/eliziff/Beaver.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          for module in legal-structure legal-pdf-parser; do
            url=$(git config -f .gitmodules submodule.$module.url)
            sha=$(git ls-tree HEAD "$module" | awk '{print $3}')
            git init "$module"
            git -C "$module" remote add origin "$url"
            git -C "$module" fetch --depth=1 origin "$sha"
            git -C "$module" checkout --detach FETCH_HEAD
          done
      - name: Build native citation and quotation engine
        run: cargo build --locked --release --no-default-features --manifest-path native/legal-structure-node/Cargo.toml
      - name: Package pinned native engine and its reference sources
        run: |
          tar --exclude=.git -czf authorities-native.tar.gz native/legal-structure-node/target/release/liblegal_structure_node.so legal-structure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authorities-native
          path: authorities-native.tar.gz
          retention-days: 1
