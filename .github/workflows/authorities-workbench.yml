name: Authorities workbench
on:
  push:
    branches: [fix/authorities-parity-workflow]
    paths: [.github/workflows/authorities-workbench.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the requested public branch
        run: |
          git init .
          git remote add origin https://github.com/eliziff/Beaver.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Recover staged source without executing it
        run: |
          python3 - <<'PY'
          import base64, gzip, zlib, pathlib, tarfile
          parts = sorted(pathlib.Path('.codex').glob('authorities-delta.*'))
          assert len(parts) == 4
          raw = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          print('Decoded magic:', repr(raw[:32]))
          if raw.startswith(b'\x1f\x8b'):
              raw = gzip.decompress(raw)
          elif raw[:1] == b'x':
              raw = zlib.decompress(raw)
          pathlib.Path('authorities-delta.decoded').write_bytes(raw)
          print('Payload size:', len(raw), 'Header:', repr(raw[:250]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authorities-recovered-delta
          path: authorities-delta.decoded
          retention-days: 1
