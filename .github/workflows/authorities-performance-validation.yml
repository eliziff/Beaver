name: Authorities performance validation
on:
  push:
    branches: [fix/authorities-ocr-loading-crash]
    paths: [.github/workflows/authorities-performance-validation.yml]
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_MODE: local
      MIKE_PDF_LAYOUT_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact locally tested files and keep original selection baseline
        run: |
          export HIGHLIGHT_RECEIPTS="$RUNNER_TEMP/authorities-performance"
          echo "HIGHLIGHT_RECEIPTS=$HIGHLIGHT_RECEIPTS" >> "$GITHUB_ENV"
          echo "MIKE_LOCAL_DATA_DIR=$RUNNER_TEMP/authorities-performance-data" >> "$GITHUB_ENV"
          git show HEAD:frontend/src/app/components/shared/views/pdfSelectionGeometry.ts > frontend/src/app/components/shared/views/pdfSelectionGeometry.benchmark-baseline.ts
          python .github/authorities-perf-candidate.py
          git submodule update --init legal-pdf-parser legal-structure
          git diff --check
      - uses: actions/download-artifact@v4
        with:
          name: authorities-perf-native
          run-id: 35687638938
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/authorities-perf-native
      - name: Verify exact compiled native source and binary
        run: |
          cmp native/legal-structure-node/src/lib.rs "$RUNNER_TEMP/authorities-perf-native/lib.rs"
          echo 'f187de8f0172f558b8f40cd57e04e0730a56a7a0acf599f491b142eaf120ac9d  '"$RUNNER_TEMP/authorities-perf-native/liblegal_structure_node.so" | sha256sum -c -
          echo "LEGAL_STRUCTURE_NATIVE=$RUNNER_TEMP/authorities-perf-native/liblegal_structure_node.so" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Backend build and broader existing text/Authorities tests
        run: |
          npm run build --prefix backend
          (cd backend && npx vitest run src/lib/__tests__/pdfOcrHandoff.test.ts src/lib/authoritiesWorkspaceApplication.test.ts src/lib/__tests__/documentProjectionService.test.ts src/lib/__tests__/documentTextReuse.test.ts src/lib/__tests__/documentTextAccess.test.ts) | tee "$HIGHLIGHT_RECEIPTS/backend-tests.log"
      - name: Shared PDF DOCX spreadsheet text readers and Authorities UI
        working-directory: frontend
        run: |
          npx vitest run src/app/components/shared/views src/app/authorities/AuthoritiesHighlightEditor.test.tsx src/app/authorities/standaloneHost.test.tsx src/app/authorities/QuotationFinding.test.tsx 'src/app/(pages)/table-of-authorities/page.test.tsx' | tee "$HIGHLIGHT_RECEIPTS/frontend-tests.log"
      - name: Build application and both standalone bundles
        run: |
          npm run build --prefix frontend | tee "$HIGHLIGHT_RECEIPTS/frontend-build.log"
          npm run check:source-boundaries
      - name: Prepare real browser and controlled scan/native fixtures
        run: |
          command -v tesseract || (sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr)
          python -m pip install --quiet pillow playwright reportlab
          python -m playwright install --with-deps chromium
          mkdir -p frontend/.regression
          cp "$HIGHLIGHT_RECEIPTS/browser-main.tsx" frontend/.regression/main.tsx
          cp "$HIGHLIGHT_RECEIPTS/reader-main.tsx" frontend/.regression/reader-main.tsx
          cp "$HIGHLIGHT_RECEIPTS/performance.js" frontend/.regression/performance.js
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"></head><body><div id="root"></div><script type="module" src="/.regression/main.tsx"></script></body></html>' > frontend/.regression/index.html
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"></head><body><div id="root"></div><script type="module" src="/.regression/reader-main.tsx"></script></body></html>' > frontend/.regression/reader.html
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from reportlab.pdfgen import canvas
          from pathlib import Path
          import os
          image=Image.new('RGB',(1224,1584),'white');draw=ImageDraw.Draw(image)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',36)
          for i,text in enumerate(['Recognized words are selectable','Second scanned line remains aligned','Third line for reverse selection']):
              draw.text((120,160+100*i),text,fill='black',font=font)
          image.save(Path(os.environ['HIGHLIGHT_RECEIPTS'])/'scan.png')
          pdf=canvas.Canvas('frontend/.regression/native.pdf')
          for page in range(1,201):
              pdf.setPageSize((612,792 if page%2 else 900));pdf.setFont('Helvetica',12)
              for row in range(28):pdf.drawString(48,730-row*20,f'Native page {page} legal evidence - line {row+1}')
              pdf.showPage()
          pdf.save()
          PY
      - name: Real OCR persistence and Chromium selection/loading/raster measurements
        run: |
          node "$HIGHLIGHT_RECEIPTS/authorities-live-check.cjs" > "$HIGHLIGHT_RECEIPTS/native.log" 2>&1 & native=$!
          (cd frontend && BEAVER_API_ORIGIN=http://127.0.0.1:3037 node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 3036) > "$HIGHLIGHT_RECEIPTS/vite.log" 2>&1 & vite=$!
          trap 'kill "$native" "$vite" 2>/dev/null || true' EXIT
          ready=false
          for n in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3037/api/fixture >/dev/null && curl -fsS http://127.0.0.1:3036/.regression/index.html >/dev/null; then ready=true; break; fi
            if ! kill -0 "$native" 2>/dev/null; then cat "$HIGHLIGHT_RECEIPTS/native.log"; exit 1; fi
            sleep 1
          done
          test "$ready" = true
          python "$HIGHLIGHT_RECEIPTS/authorities-browser-check.py"
          cat "$HIGHLIGHT_RECEIPTS/native.log"
          cat "$HIGHLIGHT_RECEIPTS/performance.json"
      - name: Publish only verified source changes on the existing PR
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,os,subprocess
          hashes=json.loads((Path(os.environ['HIGHLIGHT_RECEIPTS'])/'source-hashes.json').read_text())
          for name,expected in hashes.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,(name,'changed during validation')
          subprocess.run(['git','add','--',*hashes],check=True)
          PY
          git diff --cached --stat | tee "$HIGHLIGHT_RECEIPTS/change-stat.txt"
          git rm .github/authorities-perf-candidate.py .github/workflows/authorities-performance-validation.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'perf: bound Authorities OCR delivery, selection work and PDF raster memory'
          git push origin HEAD:fix/authorities-ocr-loading-crash
          git rev-parse HEAD | tee "$HIGHLIGHT_RECEIPTS/candidate-sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorities-performance-receipt
          path: ${{ runner.temp }}/authorities-performance/
          retention-days: 7
