name: e2e

on:
  workflow_dispatch:
  pull_request:
    branches: [main, upstream-main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      ANTHROPIC_API_KEY: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.ANTHROPIC_API_KEY || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix backend
      - run: npm ci --ignore-scripts --prefix frontend
      - run: npx playwright install --with-deps chromium

      - name: Start object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/ready >/dev/null && break
            sleep 2
          done
          AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin \
            AWS_DEFAULT_REGION=us-east-1 aws --endpoint-url http://localhost:9000 \
            s3 mb s3://mike

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.115.0
      - name: Start database
        run: |
          supabase init --force --with-vscode-settings=false || supabase init --force
          supabase start
          DB_URL=$(supabase status -o json | jq -r '.DB_URL')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f backend/schema.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"

      - name: Configure Beaver
        run: |
          API_URL=$(supabase status -o json | jq -r '.API_URL')
          PUBLISHABLE_KEY=$(supabase status -o json | jq -r '.ANON_KEY')
          SECRET_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')
          DATABASE_URL=$(supabase status -o json | jq -r '.DB_URL')
          cp backend/.env.example backend/.env
          {
            echo 'AUTH_MODE=cloud'
            echo 'NODE_ENV=test'
            echo 'PORT=3000'
            echo 'PUBLIC_ORIGIN=http://localhost:3000'
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "DATABASE_URL=${DATABASE_URL}?sslmode=disable"
            echo 'USER_API_KEYS_ENCRYPTION_SECRET=ci-user-api-keys-encryption-secret-0123456789abcdef'
            echo 'MCP_CONNECTORS_ENCRYPTION_SECRET=ci-mcp-connectors-encryption-secret-0123456789abcdef'
            echo 'RATE_LIMIT_GENERAL_MAX=100000'
            echo 'RATE_LIMIT_CHAT_MAX=100000'
            echo 'RATE_LIMIT_CHAT_CREATE_MAX=100000'
            echo 'RATE_LIMIT_UPLOAD_MAX=100000'
            echo 'RATE_LIMIT_EXPORT_MAX=100000'
            echo 'RATE_LIMIT_DATA_DELETE_MAX=100000'
            echo 'S3_ENDPOINT=http://localhost:9000'
            echo 'S3_REGION=us-east-1'
            echo 'S3_BUCKET=mike'
            echo 'S3_ACCESS_KEY_ID=minioadmin'
            echo 'S3_SECRET_ACCESS_KEY=minioadmin'
            echo 'S3_FORCE_PATH_STYLE=true'
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
          } >> backend/.env

      - run: npm run build --prefix frontend
      - run: npm run build --prefix backend
      - name: Start Beaver
        run: npm run start --prefix backend &
      - name: Wait for Beaver
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - run: npx playwright test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
