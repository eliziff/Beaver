name: Quotation integration check
on:
  push:
    branches: [fix/quotation-differences-review]
    paths: [.github/workflows/quotation-workbench.yml]
permissions:
  contents: write
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Merge current main without discarding either PDF change
        run: |
          git init .
          git config user.name 'Eli Ziff'
          git config user.email 'eliasziff@gmail.com'
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=100 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git fetch --depth=100 origin 8748904b1117c04da8697f0323664b7f66f3cb6c
          git merge --no-commit --no-ff FETCH_HEAD || test -f .git/MERGE_HEAD
          python - <<'PY'
          import subprocess
          from pathlib import Path
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          print('Conflicts:', conflicts)
          target = 'frontend/src/app/components/shared/views/PdfCanvas.tsx'
          runtime = 'backend/src/routes/authoritiesRuntime.ts'
          assert set(conflicts) <= {target, runtime}, conflicts
          if runtime in conflicts:
              s = subprocess.check_output(['git','show',f':3:{runtime}'],text=True)
              before = '    const state = reduceAuthoritiesDraft(decided, { type: "refresh", review: authoritiesReview(fresh) });'
              assert s.count(before) == 1
              s = s.replace(before, before + '\n    state.stage = current.stage === "citations" ? "citations" : "sources";')
              Path(runtime).write_text(s)
              subprocess.run(['git','add',runtime],check=True)
          if target in conflicts:
              s = subprocess.check_output(['git','show',f':3:{target}'],text=True)
              replacements = [
                  ('canvas.width = Math.ceil(viewport.width);\n                        canvas.height = Math.ceil(viewport.height);',
                   'const outputScale = Math.min(window.devicePixelRatio || 1,\n                            Math.sqrt(MAX_PDF_IMAGE_PIXELS / (viewport.width * viewport.height)));\n                        canvas.width = Math.ceil(viewport.width * outputScale);\n                        canvas.height = Math.ceil(viewport.height * outputScale);'),
                  ('const task = page.render({ canvasContext: context, viewport });',
                   'const task = page.render({ canvasContext: context, viewport,\n                            transform: [outputScale, 0, 0, outputScale, 0, 0] });'),
                  ('}, [annotationEditor, layoutRevision]);',
                   '}, [annotationEditor?.marks, annotationEditor?.tool, annotationEditor?.selectedId, annotationEditor?.disabled, layoutRevision]); // eslint-disable-line react-hooks/exhaustive-deps'),
                  ('<div ref={scrollRef} style={{ scrollbarGutter:',
                   '<div ref={scrollRef} tabIndex={annotationEditor ? 0 : undefined} style={{ scrollbarGutter:')]
              for before, after in replacements:
                  assert s.count(before) == 1, before
                  s = s.replace(before, after)
              Path(target).write_text(s)
              subprocess.run(['git','add',target],check=True)
          PY
          git diff --cached --check
          for module in legal-structure legal-pdf-parser; do
            url=$(git config -f .gitmodules submodule.$module.url)
            sha=$(git ls-files --stage "$module" | awk '{print $2}')
            git init "$module"
            git -C "$module" remote add origin "$url"
            git -C "$module" fetch --depth=1 origin "$sha"
            git -C "$module" checkout --detach FETCH_HEAD
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix backend
          npm ci --ignore-scripts --prefix frontend
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/legal-structure-node/target
          key: quotation-native-lines-${{ hashFiles('native/legal-structure-node/Cargo.lock') }}
          restore-keys: quotation-native-
      - name: Native integration
        run: cargo build --locked --release --manifest-path native/legal-structure-node/Cargo.toml
      - name: Typecheck and source boundaries
        run: |
          npm run build --prefix backend
          (cd frontend && npx tsc --noEmit)
          npm run check:source-boundaries
      - name: Focused regression checks
        run: |
          (cd backend && npx vitest run authoritiesDiscrepancy authoritiesAnnotations authoritiesWorkspaceApplication authoritiesRuntime authoritiesBuild authoritiesPreparation authoritiesSources structureNativeAuthorityTextUnits --maxWorkers=2)
          (cd frontend && npx vitest run QuotationFinding table-of-authorities AuthoritySources standaloneHost PdfView pdfAnnotations --maxWorkers=2)
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Real PDF interaction and export
        env:
          AUTHORITIES_HIGHLIGHT_OUTPUT: quotation-review-evidence
        run: npm run test:authorities:highlights
      - name: Commit validated integration to the PR only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git commit -m 'merge: preserve current main refactors with validated quotation and highlight fixes'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/quotation-differences-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quotation-review-evidence
          path: quotation-review-evidence/
          retention-days: 7
          if-no-files-found: ignore
