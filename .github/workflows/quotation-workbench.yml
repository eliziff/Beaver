name: Quotation workbench
on:
  push:
    branches: [fix/quotation-differences-review]
    paths: [.github/workflows/quotation-workbench.yml]
permissions:
  contents: write
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout application and native pins
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          for module in legal-structure legal-pdf-parser; do
            url=$(git config -f .gitmodules submodule.$module.url)
            sha=$(git ls-tree HEAD "$module" | awk '{print $3}')
            git init "$module"
            git -C "$module" remote add origin "$url"
            git -C "$module" fetch --depth=1 origin "$sha"
            git -C "$module" checkout --detach FETCH_HEAD
          done
      - name: Apply hash-verified changes and remove workbench staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          raw = lzma.decompress(base64.b64decode(''.join(Path(f'scripts/quotation-edits-{n}.b64').read_text().strip() for n in range(3))))
          assert hashlib.sha256(raw).hexdigest() == 'a1806e7b4062c65469f0ce7907daec272a91c936f9cde37e72fe9d70be9a5e5b'
          changes = json.loads(raw)
          prepared = []
          for name, before, after, edits in changes:
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              old = path.read_bytes() if path.exists() else b''
              assert (hashlib.sha256(old).hexdigest() if path.exists() else None) == before, name
              lines = old.decode().splitlines(True)
              for start, end, replacement in reversed(edits):
                  lines[start:end] = [replacement]
              result = ''.join(lines).encode() if after else None
              assert (hashlib.sha256(result).hexdigest() if result is not None else None) == after, name
              prepared.append((path, result))
          for path, result in prepared:
              if result is None: path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(result)
          PY
          sed -i 's/[[:space:]]*$//' frontend/tests/authorities-highlights/main.tsx
          git rm scripts/quotation-edits-*.b64 .github/workflows/quotation-workbench.yml
          git add -u
          git add backend/src/lib/authoritiesQuotations.ts scripts/test-authorities-highlights.mjs
          git diff --cached --check
          git -c user.name='Eli Ziff' -c user.email='eliasziff@gmail.com' commit -m 'fix: complete safe quotation review and simplify PDF highlighting'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/quotation-differences-review
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix backend
          npm ci --ignore-scripts --prefix frontend
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/legal-structure-node/target
          key: quotation-native-lines-${{ hashFiles('native/legal-structure-node/Cargo.lock') }}
          restore-keys: quotation-native-
      - name: Native integration
        run: cargo build --locked --release --manifest-path native/legal-structure-node/Cargo.toml
      - name: Typecheck and source boundaries
        run: |
          npm run build --prefix backend
          (cd frontend && npx tsc --noEmit)
          npm run check:source-boundaries
      - name: Focused regression checks
        run: |
          (cd backend && npx vitest run authoritiesDiscrepancy authoritiesAnnotations authoritiesWorkspaceApplication authoritiesRuntime authoritiesBuild structureNativeAuthorityTextUnits --maxWorkers=2)
          (cd frontend && npx vitest run QuotationFinding table-of-authorities AuthoritySources standaloneHost PdfView pdfAnnotations --maxWorkers=2)
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Real PDF interaction and export
        env:
          AUTHORITIES_HIGHLIGHT_OUTPUT: quotation-review-evidence
        run: npm run test:authorities:highlights
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quotation-review-evidence
          path: quotation-review-evidence/
          retention-days: 7
          if-no-files-found: ignore
