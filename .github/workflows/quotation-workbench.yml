name: Quotation workbench
on:
  push:
    branches: [fix/quotation-differences-review]
    paths: [.github/workflows/quotation-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application and native pins
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          for module in legal-structure legal-pdf-parser; do
            url=$(git config -f .gitmodules submodule.$module.url)
            sha=$(git ls-tree HEAD "$module" | awk '{print $3}')
            git init "$module"
            git -C "$module" remote add origin "$url"
            git -C "$module" fetch --depth=1 origin "$sha"
            git -C "$module" checkout --detach FETCH_HEAD
          done
      - name: Bound source snapshot
        run: |
          du -sh * | sort -h
          find . -type d \( -name .git -o -name node_modules -o -name target \) -prune -o -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.mjs' -o -name '*.mts' -o -name '*.js' -o -name '*.json' -o -name '*.css' -o -name '*.rs' -o -name '*.toml' -o -name '*.lock' -o -name 'AGENTS.md' -o -name '*.yml' -o -name '*.html' -o -name '.gitmodules' -o -name '.gitignore' \) -size -5M -print0 > /tmp/sources
          tar --null -T /tmp/sources -czf /tmp/quotation-source-code.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: quotation-source-code
          path: /tmp/quotation-source-code.tgz
          retention-days: 1
