name: Quotation workbench
on:
  push:
    branches: [fix/quotation-differences-review]
    paths: [.github/workflows/quotation-workbench.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application and native pins
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          for module in legal-structure legal-pdf-parser; do
            url=$(git config -f .gitmodules submodule.$module.url)
            sha=$(git ls-tree HEAD "$module" | awk '{print $3}')
            git init "$module"
            git -C "$module" remote add origin "$url"
            git -C "$module" fetch --depth=1 origin "$sha"
            git -C "$module" checkout --detach FETCH_HEAD
          done
      - name: Apply line-boundary correction on the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/quotation-native-line-boundaries.py
          git rm scripts/quotation-native-line-boundaries.py
          git add native/legal-structure-node/src/lib.rs
          git -c user.name='Eli Ziff' -c user.email='eliasziff@gmail.com' commit -m 'fix: bound printed paragraph geometry by native line addresses'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/quotation-differences-review
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/legal-structure-node/target
          key: quotation-native-lines-${{ hashFiles('native/legal-structure-node/Cargo.lock') }}
          restore-keys: quotation-native-
      - run: cargo build --locked --release --manifest-path native/legal-structure-node/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: quotation-native-lines
          path: native/legal-structure-node/target/release/liblegal_structure_node.so
          retention-days: 1
