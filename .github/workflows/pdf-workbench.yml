name: Focused PDF first-use validation
on:
  push:
    branches: [codex/pdf-first-use]
    paths: [.github/workflows/pdf-workbench.yml]
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - name: Apply the final checked viewport refinement
        env:
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin https://github.com/eliziff/Beaver.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          python3 .pdf-workbench/finalize.py
          git rm .pdf-workbench/finalize.py
          git add frontend/src/app/components/shared/views/PdfCanvas.tsx frontend/src/app/components/shared/views/PdfView.test.tsx
          git diff --cached --check
          git config user.name 'Eli Ziff'
          git config user.email 'eliasziff@gmail.com'
          git commit -m 'Keep readable PDF anchors fixed and controls above rotated text layers [skip ci]'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/pdf-first-use
          mkdir -p .pdf-validation
          git rev-parse HEAD > .pdf-validation/validated-sha.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked renderer tooling
        run: |
          npm ci
          npm ci --prefix frontend
      - name: Focused PDF, file-cache and adjacent-reader regressions only
        run: |
          (cd frontend && npx vitest run src/app/hooks/useDocumentFile.test.ts src/app/components/shared/views/PdfView.test.tsx src/app/components/shared/views/highlightQuote.test.ts src/app/components/shared/views/quoteText.test.ts src/app/components/shared/views/DocxView.test.tsx src/app/components/shared/views/DocxView.locators.test.tsx src/app/components/shared/views/TextView.test.tsx src/app/components/shared/views/SpreadsheetView.test.tsx) 2>&1 | tee .pdf-validation/tests.log
          (cd frontend && npx tsc --noEmit) 2>&1 | tee .pdf-validation/typecheck.log
      - name: Real-renderer fixture only and pinned main comparison
        if: ${{ !cancelled() }}
        run: |
          git fetch --depth=1 origin b979831747a5ceb678400fb0863a35b3a87e626e
          git worktree add --detach .pdf-baseline FETCH_HEAD
          cmp frontend/package-lock.json .pdf-baseline/frontend/package-lock.json
          ln -s "$PWD/frontend/node_modules" .pdf-baseline/frontend/node_modules
          ln -s "$PWD/node_modules" .pdf-baseline/node_modules
          npx playwright install --with-deps chromium
          node scripts/test-pdf-first-use.mjs .pdf-validation/browser .pdf-baseline 2>&1 | tee .pdf-validation/browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pdf-first-use-focused
          include-hidden-files: true
          path: |
            .pdf-validation/*.log
            .pdf-validation/*.txt
            .pdf-validation/browser/*.json
            .pdf-validation/browser/*.png
          retention-days: 7
