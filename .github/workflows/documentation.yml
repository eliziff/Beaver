name: Documentation

on:
  pull_request:
    paths:
      - '*.md'
      - 'docs/**'
      - '.gitmodules'
      - 'subrepos.lock.json'
      - 'subrepos/**'
      - 'legal-structure'
      - 'legal-pdf-parser'
      - 'legal-browser-ocr'
      - 'mike-workflows'
      - '.github/workflows/documentation.yml'

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Restore the pinned repositories
        shell: bash
        run: |
          git submodule update --init --depth 1 --recursive -- legal-structure legal-pdf-parser legal-browser-ocr mike-workflows
          git clone subrepos/OpenLegalData.bundle OpenLegalData
          git -C OpenLegalData checkout --detach "$(node -p "require('./subrepos.lock.json').repositories.OpenLegalData.commit")"
          test "$(git -C OpenLegalData rev-parse HEAD)" = "$(git ls-tree HEAD OpenLegalData | awk '{print $3}')"
      - run: node --test docs/scripts/check-docs.test.mjs
      - run: node docs/scripts/check-docs.mjs
