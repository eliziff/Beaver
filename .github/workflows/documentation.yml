name: Documentation

on:
  pull_request:
    paths:
      - '*.md'
      - 'docs/**'
      - 'repositories.json'
      - 'scripts/bootstrap-repositories.py'
      - 'subrepos/**'
      - 'legal-structure'
      - 'legal-pdf-parser'
      - 'legal-browser-ocr'
      - 'mike-workflows'
      - '.github/workflows/documentation.yml'

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: node --test docs/scripts/check-docs.test.mjs
      - name: Restore documentation-linked source repositories
        run: python3 scripts/bootstrap-repositories.py legal-structure legal-pdf-parser legal-browser-ocr OpenLegalData
      - run: node docs/scripts/check-docs.mjs
        if: success() || failure()
