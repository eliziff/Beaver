name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, upstream-main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      application: ${{ steps.scope.outputs.application }}
      cloud: ${{ steps.scope.outputs.cloud }}
      audit: ${{ steps.scope.outputs.audit }}
      authorities: ${{ steps.scope.outputs.authorities }}
      repositories: ${{ steps.repositories.outputs.refs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m unittest discover -s scripts/tests -p test_ci_scope.py && python3 -m unittest discover -s scripts/tests -p test_native_cache_key.py
      - id: scope
        run: python3 scripts/ci-scope.py
      - id: repositories
        if: steps.scope.outputs.backend == 'true' || (github.event_name != 'push' && steps.scope.outputs.application == 'true')
        name: Resolve owner main branches once for this run
        run: echo "refs=$(python3 scripts/bootstrap-repositories.py --resolve)" >> "$GITHUB_OUTPUT"
      - name: Check audit failure handling once
        if: steps.scope.outputs.audit != '[]'
        run: node --test scripts/audit-gate.test.mjs

  dependency-audit:
    needs: changes
    if: needs.changes.outputs.audit != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.changes.outputs.audit) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Audit resolved dependencies
        working-directory: ${{ matrix.directory }}
        run: node "$GITHUB_WORKSPACE/scripts/audit-gate.mjs"

  native:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || (github.event_name != 'push' && needs.changes.outputs.application == 'true')
    runs-on: ubuntu-24.04
    env:
      BEAVER_REPOSITORY_REFS: ${{ needs.changes.outputs.repositories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/bootstrap-repositories.py legal-structure legal-pdf-parser common-law-cite
      - id: identity
        name: Identify native build inputs and Rust toolchain
        run: python3 scripts/native-cache-key.py >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache
        with:
          path: native/legal-structure-node/target/release/liblegal_structure_node.so
          key: native-inputs-ubuntu24-${{ steps.identity.outputs.key }}
      - name: Build the native addon once
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --jobs 2 --manifest-path native/legal-structure-node/Cargo.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ github.sha }}
          path: native/legal-structure-node/target/release/liblegal_structure_node.so
          if-no-files-found: error
          retention-days: 1

  backend:
    needs: [changes, native]
    if: needs.changes.outputs.backend == 'true' || (github.event_name != 'push' && needs.changes.outputs.application == 'true')
    runs-on: ubuntu-24.04
    env:
      BEAVER_REPOSITORY_REFS: ${{ needs.changes.outputs.repositories }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore this run's owner source checkouts
        working-directory: .
        run: python3 scripts/bootstrap-repositories.py legal-structure legal-pdf-parser common-law-cite
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix .. --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Install document conversion dependency
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.authorities == 'true'
        run: |
          curl -fsSL https://github.com/jgm/pandoc/releases/download/3.10/pandoc-3.10-1-amd64.deb -o "$RUNNER_TEMP/pandoc.deb"
          echo "d502599878eb29af3ae5f0cb5d559134df96534125d452c7a0674a5bad2c5ecf  $RUNNER_TEMP/pandoc.deb" | sha256sum --check
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
      - name: Install shared Python citation runtime
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.authorities == 'true'
        run: python -m pip install ../common-law-cite/crates/legal-citations-py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-${{ github.sha }}
          path: native/legal-structure-node/target/release
      - run: npm run build
      - run: npm test
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.authorities == 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name != 'push'
        with:
          name: backend-${{ github.sha }}
          path: |
            backend/dist
            shared/runtime
          if-no-files-found: error
          retention-days: 1
      - name: Shared grammar and export behavior
        working-directory: .
        run: node packages/legal-grammar-tables/check.mjs && node --test shared/export-integrity.test.mjs

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || (github.event_name != 'push' && needs.changes.outputs.application == 'true')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install shared runtime dependencies
        run: npm ci --prefix .. --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm test
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.authorities == 'true'
      - run: npm run lint
        if: needs.changes.outputs.frontend == 'true'
      - run: npm run test:guards
        if: needs.changes.outputs.frontend == 'true'
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name != 'push'
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: [changes, native, backend, frontend]
    if: github.event_name != 'push' && needs.changes.outputs.application == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      cloud: ${{ fromJSON(needs.changes.outputs.cloud) }}
      native-artifact: native-${{ github.sha }}
      backend-artifact: backend-${{ github.sha }}
      frontend-artifact: frontend-${{ github.sha }}
      repositories: ${{ needs.changes.outputs.repositories }}

  authorities:
    needs: [changes, native, backend]
    if: github.event_name != 'push' && needs.changes.outputs.authorities == 'true'
    uses: ./.github/workflows/authorities-parity.yml
    with:
      native-artifact: native-${{ github.sha }}
      backend-artifact: backend-${{ github.sha }}
      repositories: ${{ needs.changes.outputs.repositories }}
