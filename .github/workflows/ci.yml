name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, upstream-main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      native: ${{ steps.scope.outputs.native }}
      frontend: ${{ steps.scope.outputs.frontend }}
      application: ${{ steps.scope.outputs.application }}
      cloud: ${{ steps.scope.outputs.cloud }}
      audit: ${{ steps.scope.outputs.audit }}
      authorities: ${{ steps.scope.outputs.authorities }}
      repositories: ${{ steps.repositories.outputs.refs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        run: python3 scripts/ci-scope.py
      - id: repositories
        if: steps.scope.outputs.backend == 'true' || steps.scope.outputs.native == 'true' || (github.event_name != 'push' && steps.scope.outputs.application == 'true')
        name: Resolve owner main branches once for this run
        env:
          NATIVE_CHANGED: ${{ steps.scope.outputs.native }}
          APPLICATION_CHANGED: ${{ steps.scope.outputs.application }}
          AUTHORITIES_CHANGED: ${{ steps.scope.outputs.authorities }}
        run: |
          owners=(common-law-cite)
          if [[ ( "$GITHUB_EVENT_NAME" != push && "$APPLICATION_CHANGED" == true ) || "$NATIVE_CHANGED" == true ]]; then
            owners+=(legal-structure legal-pdf-parser)
          fi
          if [[ "$AUTHORITIES_CHANGED" == true && "$GITHUB_EVENT_NAME" != push ]]; then
            owners+=(AuthoritiesHelper)
          fi
          echo "refs=$(python3 scripts/bootstrap-repositories.py --resolve "${owners[@]}")" >> "$GITHUB_OUTPUT"

  dependency-audit:
    needs: changes
    if: needs.changes.outputs.audit != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Audit resolved dependencies
        run: npm audit --package-lock-only --audit-level=high

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true' || (github.event_name != 'push' && needs.changes.outputs.application == 'true')
    runs-on: ubuntu-24.04
    env:
      BEAVER_REPOSITORY_REFS: ${{ needs.changes.outputs.repositories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/bootstrap-repositories.py legal-structure legal-pdf-parser common-law-cite
      - id: identity
        name: Identify native build inputs and Rust toolchain
        run: python3 scripts/native-cache-key.py >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache
        with:
          path: native/legal-structure-node/target/release/liblegal_structure_node.so
          key: native-inputs-ubuntu24-${{ steps.identity.outputs.key }}
      - name: Reuse compiled Rust dependencies when native source changes
        if: steps.cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/legal-structure-node -> target
      - name: Build the native addon once
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo build --locked --release --jobs 2 --manifest-path native/legal-structure-node/Cargo.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ github.sha }}
          path: native/legal-structure-node/target/release/liblegal_structure_node.so
          if-no-files-found: error
          retention-days: 1

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || (github.event_name != 'push' && needs.changes.outputs.application == 'true')
    runs-on: ubuntu-24.04
    env:
      BEAVER_REPOSITORY_REFS: ${{ needs.changes.outputs.repositories }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore this run's owner source checkouts
        working-directory: .
        run: python3 scripts/bootstrap-repositories.py common-law-cite
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix .. --workspace backend --include-workspace-root --ignore-scripts
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name != 'push'
        with:
          name: backend-${{ github.sha }}
          path: |
            backend/dist
            shared/runtime
          if-no-files-found: error
          retention-days: 1
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || (github.event_name != 'push' && needs.changes.outputs.application == 'true')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend and shared dependencies once
        run: npm ci --prefix .. --workspace frontend --include-workspace-root --ignore-scripts
      - run: npm run check
        if: needs.changes.outputs.frontend == 'true'
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name != 'push'
        with:
          name: frontend-${{ github.sha }}
          path: frontend/.tmp/app-dist
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: [changes, native, backend, frontend]
    if: github.event_name != 'push' && needs.changes.outputs.application == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      cloud: ${{ fromJSON(needs.changes.outputs.cloud) }}
      native-artifact: native-${{ github.sha }}
      backend-artifact: backend-${{ github.sha }}
      frontend-artifact: frontend-${{ github.sha }}
      repositories: ${{ needs.changes.outputs.repositories }}

  authorities:
    needs: [changes, native, backend]
    if: github.event_name != 'push' && needs.changes.outputs.authorities == 'true'
    uses: ./.github/workflows/authorities-parity.yml
    with:
      native-artifact: native-${{ github.sha }}
      backend-artifact: backend-${{ github.sha }}
      repositories: ${{ needs.changes.outputs.repositories }}
