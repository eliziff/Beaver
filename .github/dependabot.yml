version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { root-dependencies: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    groups: { backend-dependencies: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups: { frontend-dependencies: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gitsubmodule
    directory: /
    schedule: { interval: daily }
