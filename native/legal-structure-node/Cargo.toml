[package]
name = "legal-structure-node"
version = "0.1.0"
edition = "2021"
license = "MIT"

# A library the measuring tools (native/structure-tools) link. The addon and the browser engine are this library as a
# cdylib, which their builds ask for themselves (`cargo rustc --lib --crate-type cdylib`, scripts/native-build.mjs): set
# here, every tool's build would link an addon.
[lib]
crate-type = ["rlib"]

# The TypeScript declarations of the engine's wire types, written to shared/engine-types (src/bindings.rs).
[[bin]]
name = "export-types"
path = "src/bin/export_types.rs"
required-features = ["binding-types"]

[features]
default = ["legalpdf", "a2aj"]
# A2AJ's documents, from its API's records or the local store (SQLite), and the citator graph built from the store.
a2aj = ["dep:rusqlite", "legal-structure-features/a2aj-store", "legal-structure-features/citator-graph"]
# Word documents: the parser's DOCX reading without its PDF pipeline (Authority Linker's engine, build-engine.mjs --word).
docx = ["dep:legalpdf"]
legalpdf = ["docx", "legalpdf/pdf"]
# The TypeScript declarations of its wire types and the crates' it serves (src/bindings.rs, the export-types bin).
binding-types = ["dep:ts-rs", "alr-verifier/binding-types", "legal-structure/binding-types", "legal-structure-features/binding-types", "legalpdf?/binding-types"]

[dependencies]
legal-structure = { path = "../../legal-structure", features = ["structure-inference", "citator", "journal", "native-markup", "opinion"] }
legal-structure-features = { path = "../../legal-structure/features", features = ["canada", "canlii", "citator", "courtlistener", "document-query", "foreign-case", "journal-store", "structure-inference", "quote-verification"] }
legal-structure-model = { path = "../../legal-structure/model" }
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip as the a2aj-gold crate needs it: one serde_json for the workspace, so the stack under it builds once
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
# The local A2AJ store, read by the engine itself; the browser build compiles SQLite with wasi-sdk (WASI_SDK_PATH).
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
regex = "1.13"
sha2 = "0.11"
ts-rs = { version = "12", optional = true, features = ["serde-json-impl"] }
unicode-normalization = "0.1"
# A workbook's grid (formats/sheet.rs): calamine reads xlsx, xlsm and xls, its zip bounds the package, ooxml-numfmt
# writes a number in its number format, ryu-js writes a number as JavaScript prints it.
calamine = "0.38"
cfb = "0.16"
zip = { version = "9", default-features = false }
ooxml-numfmt = { version = "0.2.3", default-features = false }
ryu-js = "1.0.3"
# A presentation's slides, an email and a Word redline (formats/slides.rs, email.rs, redline.rs): the packages open with
# the zip above, Word's XML parses with quick-xml (the version calamine reads with), an email's MIME with mail-parser,
# and a charset is found by its WHATWG label with encoding_rs.
quick-xml = "0.42"
# A source set from its Markdown (assembly/statute.rs) reads it as GitHub does, tables included.
pulldown-cmark = { version = "0.13", default-features = false }
mail-parser = { version = "1.0.1", features = ["full_encoding"] }
encoding_rs = "0.8.35"
# The ALR Quote Verifier's workbook of a checked draft, which the engine serves.
alr-verifier = { path = "../alr-verifier" }

# The Node addon links native OCR and layout runtimes.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
legalpdf = { package = "legal-pdf-parser", path = "../../legal-pdf-parser", features = ["full"], optional = true }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
# The addon's allocator, its freed memory returned at once (node.rs).
mimalloc = { version = "0.1.52", default-features = false }
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }

# The browser build (wasm32-wasip1) parses the same PDFs; recognition runs in the page.
[target.'cfg(target_arch = "wasm32")'.dependencies]
legalpdf = { package = "legal-pdf-parser", path = "../../legal-pdf-parser", features = ["language"], optional = true }

[build-dependencies]
napi-build = "2"

