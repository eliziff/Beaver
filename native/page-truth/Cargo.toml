[package]
name = "page-truth"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Printed page numbers as their sources hold them (the gold store, journals.db, A2AJ's page marks), and the page map scored on them"

# It reads JSON, SQLite and the page map's own crate, so it builds on its own in seconds: none of the engine is under it.
[dependencies]
legal-pdf-pages = { path = "../../legal-pdf-parser/legal-pdf-pages" }
regex = "1.13"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
