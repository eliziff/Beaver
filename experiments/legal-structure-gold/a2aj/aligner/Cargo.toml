[package]
name = "a2aj-align"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "a2aj-align"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# The renderer the parser reads scans with, for proof sheets.
hayro = { version = "0.7.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
# The product's citation reader, and its outline of a case.
legal-structure = { path = "../../../../legal-structure", features = ["structure-inference", "citator", "journal", "native-markup"] }
legal-structure-features = { path = "../../../../legal-structure/features", features = ["structure-inference", "document-query"] }
# The parser's PDF library: where a page's images stand.
lopdf = { version = "0.45.0", default-features = false }
# Every core aligns at once, and Windows' process heap would serialize them on its lock.
mimalloc = { version = "0.1.52", default-features = false }
regex = "1.13"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
# Records keep the keys in their order, and the reader's coordinates to the last bit.
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
unicode-normalization = "0.1"

[build-dependencies]
sha2 = "0.10"


# Its own workspace: an experiment the root workspace doesn't build.
[workspace]

# legal-structure builds with the citation crates from the checkout beside it, as the root workspace does.
[patch."https://github.com/eliziff/common-law-cite.git"]
legal-citations = { path = "../../../../common-law-cite/crates/legal-citations" }
legal-text = { path = "../../../../common-law-cite/crates/legal-text" }
