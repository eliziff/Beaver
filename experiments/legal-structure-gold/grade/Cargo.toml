[package]
name = "structure-gold"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
diff-match-patch-rs = "0.5.1"
legalpdf = { package = "legal-pdf-parser", path = "../../../legal-pdf-parser", features = ["ocr", "ppdoc"] }
legal-pdf-core = { path = "../../../legal-pdf-parser/legal-pdf-core", features = ["ort-runtime"] }
# The engine the grader installs into the parser at start: the parser crates build without it.
legal-structure = { path = "../../../legal-structure", features = ["structure-inference"] }
legal-structure-features = { path = "../../../legal-structure/features" }
legal-structure-model = { path = "../../../legal-structure/model" }
legal-structure-tagger = { path = "../../../legal-structure/tagger", features = ["onnx"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
sha2 = "0.10"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
