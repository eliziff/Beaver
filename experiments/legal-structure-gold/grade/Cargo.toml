[package]
name = "structure-gold"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
diff-match-patch-rs = "0.5.1"
legalpdf = { package = "legal-pdf-parser", path = "../../../legal-pdf-parser", features = ["ocr", "ppdoc-full"] }
legal-pdf-core = { path = "../../../legal-pdf-parser/legal-pdf-core", features = ["structure-analysis", "ort-runtime"] }
legal-structure = { path = "../../../legal-structure" }
legal-structure-model = { path = "../../../legal-structure/model" }
legal-structure-tagger = { path = "../../../legal-structure/tagger", features = ["onnx"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
sha2 = "0.10"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
