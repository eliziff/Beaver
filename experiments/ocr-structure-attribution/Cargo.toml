[package]
name = "ocr-structure-attribution"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
legalpdf = { package = "legal-pdf-parser", path = "../../legal-pdf-parser", features = ["ocr"] }
legal-pdf-core = { path = "../../legal-pdf-parser/legal-pdf-core", features = ["structure-analysis"] }
legal-pdf-ocr = { path = "../../legal-pdf-parser/legal-pdf-ocr", features = ["attribution"] }
legal-structure = { path = "../../legal-structure" }
legal-pdf-tagger = { path = "../../legal-pdf-parser/legal-pdf-tagger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
diff-match-patch-rs = "0.5.1"
