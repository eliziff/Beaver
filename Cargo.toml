# The native consumers of the parser stack build as one workspace: one Cargo.lock resolves every
# third-party crate once, so the addon, the grader and the OCR experiment share each dependency's
# build in the one target folder (.cargo/config.toml) and never link one another's. The parser
# (legal-pdf-parser, the tagger among its crates), legal-structure and common-law-cite stay
# repositories and workspaces of their own, path dependencies here; this manifest's [patch] maps the
# revisions they pin of one another to the checkouts here.
[workspace]
resolver = "2"
members = [
    "native/legal-structure-node",
    "experiments/legal-structure-gold/grade",
    "experiments/ocr-structure-attribution",
]
# The workspaces these depend on stay their own (cargo would otherwise take any path dependency in
# this folder as a member); Rust packages of other products and the benchmark owners' copies build
# on their own.
exclude = ["legal-pdf-parser", "legal-structure", "common-law-cite", "AuthoritiesHelper", "benchmarks", "legal-pinpointer"]

[patch.crates-io]
hayro-jpeg2000 = { git = "https://github.com/LaurenzV/hayro.git", rev = "ff7e2e407f6b9c429b44dc29a851180727892b6c" }

# The repositories beside this one that others pin by revision build from these checkouts here, so a change in one is
# built with the rest before it is pushed and pinned. In this manifest, not .cargo/config.toml, so the override is this
# workspace's alone: a sibling's own workspace, built or resolved in its folder here, keeps its pins and lock file.
[patch."https://github.com/eliziff/common-law-cite.git"]
legal-citations = { path = "common-law-cite/crates/legal-citations" }
legal-text = { path = "common-law-cite/crates/legal-text" }

[patch."https://github.com/eliziff/legal-structure-parser.git"]
legal-structure = { path = "legal-structure" }
legal-layout = { path = "legal-structure/layout" }
legal-structure-model = { path = "legal-structure/model" }
legal-structure-features = { path = "legal-structure/features" }

[profile.dev]
debug = 0

# Debug SIMD raster compositing took minutes per page in a live stack sample: the renderer is
# optimised even in development builds.
[profile.dev.package.vello_cpu]
opt-level = 3

[profile.dev.package.fearless_simd]
opt-level = 3

[profile.dev.package.hayro]
opt-level = 3

[profile.release]
debug = 0
strip = true
incremental = true

[profile.profiling]
inherits = "release"
debug = 1
strip = false
